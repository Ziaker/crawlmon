<!doctype html>
<html><head><meta charset="utf-8"><title>Burst fuse</title>
<style>
body{margin:0;background:#0a1929;font-family:sans-serif;color:#f0eedf}
#bstage{position:relative;width:680px;height:260px;margin:0 auto}
#bblock{position:absolute;left:60px;top:150px;width:320px;height:52px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);background:#d7fd6a;transition:background .15s}
#bblock.burst{background:#ff8a2b}
#btxt{position:absolute;left:60px;top:150px;width:320px;height:52px;font:italic 800 30px/52px 'Kanit',sans-serif;color:#080e18;padding-left:48px;box-sizing:border-box;pointer-events:none}
#bdia{position:absolute;left:18px;top:19px;width:14px;height:14px;background:#080e18;transform:rotate(45deg) scale(.75)}
#bstage canvas{position:absolute;left:0;top:0;pointer-events:none}
#bfire{clip-path:polygon(69px 150px,380px 150px,371px 202px,60px 202px)}
@keyframes bpop{0%{transform:scale(1)}28%{transform:scale(1.08,1.16);filter:brightness(1.6)}100%{transform:scale(1);filter:none}}
.pop{animation:bpop .32s ease-out}
.row{display:flex;gap:10px;justify-content:center;margin:12px 0 4px}
button{padding:6px 14px}
#bst{text-align:center;font-size:13px;opacity:.8}
</style></head>
<body>
<div id="bstage">
<div id="bblock"></div>
<canvas id="bfire" width="680" height="260"></canvas>
<div id="btxt"><span id="bdia"></span>FIGHT</div>
<canvas id="bfx" width="680" height="260"></canvas>
</div>
<div class="row"><button id="bgo">Disparar burst (2 s)</button><button id="bstop">Clique no Fight (corta o pavio)</button></div>
<div id="bst">parado</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { BatchedRenderer, ParticleSystem, ConstantValue, IntervalValue, ConstantColor, ColorOverLife, SizeOverLife, PiecewiseBezier, Bezier, ColorRange, RenderMode, ApplyForce } from 'https://esm.sh/three.quarks@0.15.6?deps=three@0.160.0';
const W=680,H=260,DUR=2.0,RY=H-144;
const st=document.getElementById('bst');
try{
function mk(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t}
function poly(g,pts,fill,s,cx,cy){g.beginPath();pts.forEach((p,i)=>{const x=cx+(p[0]-cx)*s,y=cy+(p[1]-cy)*s;i?g.lineTo(x,y):g.moveTo(x,y)});g.closePath();g.fillStyle=fill;g.fill()}
const FL=[[64,2],[84,42],[74,54],[100,86],[86,122],[42,122],[28,86],[54,58],[44,44]];
const flameTex=mk(128,128,g=>{poly(g,FL,'#e03a1e',1,64,122);poly(g,FL,'#ffab40',.68,64,122);poly(g,FL,'#ffe066',.4,64,122)});
const shardTex=mk(128,128,g=>{poly(g,[[64,2],[84,64],[64,126],[44,64]],'#ffd23a',1,64,64);poly(g,[[64,22],[74,64],[64,106],[54,64]],'#fff6d6',1,64,64)});
const smokeTex=mk(128,128,g=>{const o=[[22,70],[40,26],[82,18],[112,52],[104,100],[62,114],[30,102]];poly(g,o,'#7d8590',1,64,64);poly(g,[[40,26],[82,18],[70,62],[44,70]],'#a6adb8',1,64,64)});
const ropeTex=mk(64,64,g=>{g.fillStyle='#ead2a0';g.fillRect(0,0,64,64);g.fillStyle='#9a6a3a';for(let i=-2;i<6;i++){g.beginPath();g.moveTo(0,i*16+8);g.lineTo(64,i*16-8);g.lineTo(64,i*16-18);g.lineTo(0,i*16-2);g.fill()}g.fillStyle='rgba(60,30,10,.35)';g.fillRect(0,0,64,3)},true);
const rd=new THREE.WebGLRenderer({canvas:document.getElementById('bfx'),alpha:true,antialias:true});rd.setSize(W,H,false);rd.setClearColor(0,0);
const sc=new THREE.Scene();
const fov=2*Math.atan(H/2/700)*180/Math.PI;
const cam=new THREE.PerspectiveCamera(fov,W/H,10,2000);cam.position.set(W/2,H/2,700);
sc.add(new THREE.AmbientLight(0xffffff,.85));
const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(-200,420,520);sc.add(sun);
const plight=new THREE.PointLight(0xff7a20,3,140,0);sc.add(plight);
const rope=new THREE.Mesh(new THREE.CylinderGeometry(5.6,5.6,1,20,1,false),new THREE.MeshStandardMaterial({map:ropeTex,roughness:.9,metalness:0}));rope.rotation.z=Math.PI/2;sc.add(rope);
const charMat=new THREE.MeshStandardMaterial({color:0x2a1a12,emissive:0xff4a08,emissiveIntensity:1,roughness:1});
const char=new THREE.Mesh(new THREE.CylinderGeometry(5.2,5.8,1,20,1,false),charMat);char.rotation.z=Math.PI/2;sc.add(char);
const fusegrp=[rope,char,plight];
const br=new BatchedRenderer();sc.add(br);
function shape(fn){return{type:'custom',initialize(p){fn(p)},update(){},toJSON(){return{}},clone(){return this}}}
function sys(map,cfg,beh){const ps=new ParticleSystem({duration:1,looping:true,worldSpace:true,maxParticles:500,renderMode:RenderMode.BillBoard,material:new THREE.MeshBasicMaterial({map,transparent:true,depthWrite:false}),startTileIndex:new ConstantValue(0),uTileCount:1,vTileCount:1,emissionOverTime:new ConstantValue(0),...cfg});for(const b of beh||[])ps.addBehavior(b);br.addSystem(ps);sc.add(ps.emitter);return ps}
const V=(r,g,b,a)=>new THREE.Vector4(r,g,b,a);
const WH=new ColorOverLife(new ColorRange(V(1,1,1,1),V(1,1,1,0)));
const SHR=new SizeOverLife(new PiecewiseBezier([[new Bezier(1,.9,.6,.1),0]]));
const head={x:69},boom={x:220,y:H-176};
const headFlame=sys(flameTex,{startLife:new IntervalValue(.2,.38),startSpeed:new IntervalValue(40,90),startSize:new IntervalValue(15,26),startRotation:new IntervalValue(-.35,.35),startColor:new ConstantColor(V(1,1,1,1)),shape:shape(p=>{p.position.set(head.x+(Math.random()-.5)*6,RY+4,6);p.velocity.set((Math.random()-.5)*.5,1,0).multiplyScalar(p.startSpeed)})},[WH,SHR]);
const sparks=sys(shardTex,{startLife:new IntervalValue(.3,.65),startSpeed:new IntervalValue(120,300),startSize:new IntervalValue(7,13),startColor:new ConstantColor(V(1,1,1,1)),shape:shape(p=>{p.position.set(head.x,RY,7);const a=Math.random()*Math.PI*2;p.velocity.set(Math.cos(a)*1.1,Math.sin(a)*.9+.35,0).multiplyScalar(p.startSpeed);p.rotation=a-Math.PI/2})},[WH,SHR,new ApplyForce(new THREE.Vector3(0,-1,0),new ConstantValue(380))]);
const smoke=sys(smokeTex,{startLife:new IntervalValue(.9,1.5),startSpeed:new IntervalValue(14,30),startSize:new IntervalValue(8,14),startRotation:new IntervalValue(0,6.28),startColor:new ConstantColor(V(1,1,1,.85)),shape:shape(p=>{p.position.set(head.x,RY+14,2);p.velocity.set((Math.random()-.5)*.7,1,0).multiplyScalar(p.startSpeed)})},[WH,new SizeOverLife(new PiecewiseBezier([[new Bezier(.6,1,1.4,1.8),0]]))]);
const bFlame=sys(flameTex,{startLife:new IntervalValue(.35,.65),startSpeed:new IntervalValue(110,250),startSize:new IntervalValue(32,56),startColor:new ConstantColor(V(1,1,1,1)),shape:shape(p=>{p.position.set(boom.x,boom.y,8);const a=Math.random()*Math.PI*2;p.velocity.set(Math.cos(a),Math.sin(a),0).multiplyScalar(p.startSpeed);p.rotation=a-Math.PI/2})},[WH,SHR]);
const bShard=sys(shardTex,{startLife:new IntervalValue(.3,.6),startSpeed:new IntervalValue(180,380),startSize:new IntervalValue(9,16),startColor:new ConstantColor(V(1,1,1,1)),shape:shape(p=>{p.position.set(boom.x,boom.y,9);const a=Math.random()*Math.PI*2;p.velocity.set(Math.cos(a),Math.sin(a),0).multiplyScalar(p.startSpeed);p.rotation=a-Math.PI/2})},[WH,SHR]);
const bSmoke=sys(smokeTex,{startLife:new IntervalValue(.5,.9),startSpeed:new IntervalValue(40,110),startSize:new IntervalValue(12,20),startRotation:new IntervalValue(0,6.28),startColor:new ConstantColor(V(1,1,1,.9)),shape:shape(p=>{p.position.set(boom.x,boom.y,5);const a=Math.random()*Math.PI*2;p.velocity.set(Math.cos(a),Math.sin(a),0).multiplyScalar(p.startSpeed)})},[WH,new SizeOverLife(new PiecewiseBezier([[new Bezier(.7,1,1.4,1.8),0]]))]);
window.__dbg={bFlame,bShard,bSmoke,sparks};
const fc=document.getElementById('bfire').getContext('2d');
const LAYERS=[{rgb:'224,58,30',h:80,k:.05,w:2.4,p:0},{rgb:'255,171,64',h:63,k:.06,w:3.1,p:1.9},{rgb:'255,216,74',h:45,k:.072,w:3.8,p:3.4},{rgb:'255,248,224',h:27,k:.088,w:4.6,p:5.0}];
const BOT=202,X0=56,X1=384,SP=1.9;
function flames(tt,amp){fc.clearRect(0,0,W,H);if(amp<=0)return;
 for(const L of LAYERS){const gr=fc.createLinearGradient(0,BOT-L.h*amp,0,BOT);gr.addColorStop(0,'rgba('+L.rgb+',.12)');gr.addColorStop(.55,'rgba('+L.rgb+',.7)');gr.addColorStop(1,'rgba('+L.rgb+',1)');
  fc.globalAlpha=.78+.22*Math.sin(tt*L.w*SP*1.3+L.p*3);fc.beginPath();fc.moveTo(X0,BOT+2);
  for(let x=X0;x<=X1;x+=2){const th=x*L.k-tt*L.w*SP+L.p;const f=.5+.5*Math.sin(th+.9*Math.sin(th*.5+tt*2.2));const g=.5+.5*Math.sin(x*.021+tt*L.w*SP*.6+L.p*2);const y=BOT-L.h*amp*(.3+.7*Math.pow(f,2.4))*(.75+.25*g);fc.lineTo(x,y)}
  fc.lineTo(X1,BOT+2);fc.closePath();fc.fillStyle=gr;fc.fill()}
 fc.globalAlpha=1}
const blk=document.getElementById('bblock'),txt=document.getElementById('btxt');
let t0=0,on=false,amp=0,boomNow=false,boomOff=false;
function show(v){for(const o of fusegrp)o.visible=v}
show(false);
function start(){on=true;t0=performance.now();blk.classList.add('burst');show(true)}
function stop(why,hit){on=false;blk.classList.remove('burst');show(false);for(const s of [headFlame,sparks,smoke])s.emissionOverTime=new ConstantValue(0);st.textContent=why;
 if(hit){boomNow=true;for(const el of [blk,txt]){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}}}
document.getElementById('bgo').onclick=start;
document.getElementById('bstop').onclick=()=>stop('cortado por uma ação',true);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000)||.016;last=now;
 if(boomOff){for(const s of [bFlame,bShard,bSmoke])s.emissionOverTime=new ConstantValue(0);boomOff=false}
 if(boomNow){bFlame.emissionOverTime=new ConstantValue(13/dt);bShard.emissionOverTime=new ConstantValue(18/dt);bSmoke.emissionOverTime=new ConstantValue(3/dt);boomNow=false;boomOff=true}
 amp=on?Math.min(1,amp+dt*5):Math.max(0,amp-dt*8);
 if(on){const e=(now-t0)/1000;const f=Math.min(1,e/DUR);head.x=69+311*f;
  const fl=.85+.15*Math.sin(now/38)+.1*Math.sin(now/23);
  const CL=14,a=head.x+CL,b=380,len=Math.max(.01,b-a);
  rope.scale.set(1,len,1);rope.position.set((a+b)/2,RY,0);ropeTex.repeat.set(1,len/16);rope.visible=len>1;
  char.scale.set(1,CL,1);char.position.set(head.x+CL/2,RY,0);charMat.emissiveIntensity=1.2+fl;
  plight.position.set(head.x+6,RY,26);plight.intensity=2.4+1.6*fl;
  headFlame.emissionOverTime=new ConstantValue(34);sparks.emissionOverTime=new ConstantValue(70);smoke.emissionOverTime=new ConstantValue(12);
  st.textContent='pavio aceso: '+((1-f)*DUR).toFixed(1)+' s';if(e>=DUR)stop('o pavio acabou',false)}
 flames(now/1000,amp);
 br.update(dt);rd.render(sc,cam);
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}catch(e){st.textContent='erro: '+e.message}
</script></body></html>
