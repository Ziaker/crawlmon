<style>
@font-face { font-family: 'Kanit Black'; src: url('../../assets/fonts/kanit/Kanit-BlackItalic.ttf') format('truetype'); font-weight: 900; font-style: italic; }
:root { --ink:#10263a; --ink2:#0a1a27; --panel:#0e2435; --cream:#f4eee1; --paper:#fdfde8; --muted:#8ea9b5; --line:rgba(244,238,225,.14); --lime:#d7fd6a; --coral:#ff624f; --gold:#f7cb78; --cyan:#38bdf8; --dark:#0a1a27;
  --fd:'Kanit Black','Arial Black',Impact,sans-serif; --fb:'Segoe UI',system-ui,sans-serif; --fm:'Cascadia Code',Consolas,monospace; }
* { box-sizing: border-box; }
body { margin:0; background:var(--ink); color:var(--cream); font:12px/1.45 var(--fb); min-height:100vh;
  background-image: linear-gradient(180deg, rgba(8,20,32,.0), rgba(8,20,32,.75)), repeating-linear-gradient(90deg, rgba(56,189,248,.035) 0 1px, transparent 1px 114px); }
.bar { height:4px; background:linear-gradient(90deg, var(--lime) 0 25%, var(--coral) 25% 42%, transparent 42%); }
header { display:flex; align-items:flex-end; gap:18px; padding:14px 22px 8px; flex-wrap:wrap; }
h1 { font:italic 900 34px/1 var(--fd); margin:0; letter-spacing:.01em; }
h1 i { color:var(--coral); font-style:normal; margin:0 4px; } h1 b { color:var(--lime); }
.sub { color:var(--muted); font-weight:700; letter-spacing:.12em; font-size:10px; text-transform:uppercase; }
.sp { flex:1; }
button, select, input { font:inherit; }
.btn { border:0; background:var(--paper); color:#0a1a27; font-weight:900; letter-spacing:.06em; text-transform:uppercase; font-size:10px; padding:7px 14px; cursor:pointer; clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }
.btn:hover { background:var(--lime); } .btn.c { background:var(--coral); color:#fff; } .btn.g { background:transparent; color:var(--cream); box-shadow:inset 0 0 0 1px var(--line); clip-path:none; }
select, input[type=text], input[type=number], textarea { background:#0a1a27; color:var(--cream); border:1px solid var(--line); padding:5px 7px; outline:none; min-width:0; }
select:focus, input:focus, textarea:focus { border-color:var(--lime); }
main { display:grid; grid-template-columns:230px minmax(0,1fr) 348px; gap:14px; padding:6px 22px 22px; align-items:start; }
.pane { background:rgba(10,26,39,.82); border:1px solid var(--line); padding:12px; position:sticky; top:8px; max-height:calc(100vh - 16px); overflow:auto; scrollbar-width:thin; }
@media (max-width:1100px) { .pane { position:static; max-height:none; } }
.pt { font:italic 900 15px/1 var(--fd); color:var(--lime); margin:0 0 8px; display:flex; justify-content:space-between; align-items:baseline; }
.pt small { font:700 9px var(--fb); color:var(--muted); letter-spacing:.1em; }
.cat { font-weight:900; font-size:9px; letter-spacing:.14em; color:var(--muted); margin:10px 0 5px; text-transform:uppercase; display:flex; gap:6px; align-items:center; }
.cat::after { content:''; flex:1; height:1px; background:var(--line); }
.blk { display:flex; align-items:center; gap:7px; padding:5px 9px 5px 7px; margin:0 0 4px; cursor:grab; font-weight:800; font-size:11px; color:#0a1a27; background:var(--paper); clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%); user-select:none; }

.blk.gap { background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1px var(--line); clip-path:none; border-left:3px dashed var(--coral); }
.blk.part::after { content:'parcial'; margin-left:auto; font-size:8px; color:#b45309; letter-spacing:.08em; text-transform:uppercase; }
/* cabeçalho do move */
.head { background:var(--paper); color:#0a1a27; padding:12px 18px 12px 22px; clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%); display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:8px 12px; position:relative; }

.head { display:block; padding:14px 22px 12px 26px; }
.hrow { display:flex; gap:14px 22px; flex-wrap:wrap; align-items:flex-end; margin:0 0 10px; }
.hrow:last-child { margin:0; }

.pick { display:flex; gap:3px; flex-wrap:wrap; }
.bdg { width:34px; height:28px; border:0; padding:0; cursor:pointer; display:grid; place-items:center; clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%); background:var(--c,#334155); opacity:.3; transition:opacity .12s, transform .12s; }
.bdg img { width:17px; height:17px; display:block; } .bdg.dk img { filter:brightness(0); }
.bdg:hover { opacity:.75; transform:translateY(-2px); } .bdg.on { opacity:1; transform:translateY(-2px) scale(1.12); box-shadow:0 0 0 2px #0a1a27; }
.pips { display:flex; gap:3px; } .pip { width:22px; height:14px; border:0; padding:0; cursor:pointer; background:#c9c6b4; transform:skewX(-14deg); } .pip.on { background:#0e7490; }
.who { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
.face { width:38px; height:38px; border:2px solid #0a1a27; padding:0; cursor:pointer; opacity:.32; background:linear-gradient(180deg,#77c7d7 0%,#8fcfc7 28%,#afd7b7 48%,#dfe7bf 72%,#e7f7b7 100%); background-size:cover; overflow:hidden; position:relative; transition:opacity .12s, transform .12s; }
.face i { position:absolute; inset:0; background-repeat:no-repeat; } .face.on { opacity:1; transform:translateY(-2px); box-shadow:0 3px 0 var(--lime); } .face:hover { opacity:.8; }
.face.sm { width:28px; height:28px; }
.gen { border:0; cursor:pointer; font-weight:900; font-size:10px; letter-spacing:.08em; padding:0 12px; height:38px; background:#c9c6b4; color:#0a1a27; clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%); } .gen.on { background:#0a1a27; color:var(--lime); }
.gcard .bdg { opacity:1; cursor:default; width:28px; height:24px; transform:none; } .gcard .bdg img { width:14px; height:14px; }
.head .nm { grid-column:span 2; } .head .nm input { font:italic 900 20px/1.1 var(--fd); border:0; border-bottom:2px solid #0a1a27; background:transparent; }
/* linha do tempo */
.tl { display:flex; height:22px; margin:12px 0 4px; font-weight:900; font-size:9px; letter-spacing:.08em; text-transform:uppercase; }
.tl div { display:flex; align-items:center; justify-content:center; color:#0a1a27; clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%); margin-right:-3px; min-width:54px; white-space:nowrap; overflow:hidden; }
.lane { border:1px dashed var(--line); margin:8px 0 0; padding:8px 10px 6px; min-height:52px; position:relative; transition:background .12s; }

.lane h3 small { font:700 9px var(--fb); color:var(--muted); letter-spacing:.08em; }
.lane textarea { width:100%; margin-top:4px; font-size:11px; resize:vertical; min-height:26px; color:var(--muted); }
.empty { color:var(--muted); font-style:italic; font-size:11px; }
.node { display:inline-flex; vertical-align:top; align-items:center; gap:6px; margin:0 6px 6px 0; padding:4px 9px; font-weight:800; font-size:11px; cursor:pointer; background:var(--paper); color:#0a1a27; border-left:5px solid #22c55e; }
.node.vfx { border-left-color:var(--cyan); } .node.sel { outline:2px solid var(--lime); outline-offset:2px; }
.node.gap { background:#2a1620; color:#ffd6cf; border-left:5px dashed var(--coral); } .node.part { border-left-style:double; }

.node.trigger { display:inline-block; background:rgba(245,158,11,.14); color:var(--gold); border:1px solid rgba(245,158,11,.5); border-left:5px solid #f59e0b; padding:4px 6px 0 8px; }
.node.trigger > .lbl { display:flex; gap:6px; align-items:center; margin-bottom:5px; }
.node.trigger > .kids { min-height:26px; min-width:120px; border:1px dashed rgba(245,158,11,.35); padding:5px 5px 0; margin-bottom:6px; }
/* inspetor */
.f { display:grid; grid-template-columns:104px 1fr; gap:5px 8px; align-items:center; margin:0 0 5px; }
.f span { color:var(--muted); font-weight:700; font-size:10px; } .f input, .f select { width:100%; }
.tag { display:inline-block; padding:2px 7px; font-weight:900; font-size:9px; letter-spacing:.08em; text-transform:uppercase; transform:skewX(-10deg); margin:0 4px 4px 0; }
.tag.ok { background:#22c55e; color:#052e13; } .tag.part { background:#f59e0b; color:#3b2300; } .tag.gap { background:var(--coral); color:#fff; }
.tabs { display:flex; gap:4px; margin:0 0 10px; flex-wrap:wrap; }
.tabs button { border:0; background:transparent; color:var(--muted); font-weight:900; font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:5px 9px; cursor:pointer; box-shadow:inset 0 -2px 0 var(--line); }
.tabs button.on { color:#0a1a27; background:var(--lime); box-shadow:none; }
.stat { display:grid; grid-template-columns:74px 1fr 30px; gap:6px; align-items:center; margin:0 0 3px; font-size:10px; color:var(--muted); font-weight:700; }
.stat output { color:var(--cream); text-align:right; font-family:var(--fm); }
input[type=range] { accent-color:var(--lime); width:100%; }
.big { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:8px 0; }
.big div { background:#0a1a27; padding:7px 8px; border-left:3px solid var(--lime); } .big b { display:block; font:italic 900 20px/1 var(--fd); } .big span { font-size:9px; color:var(--muted); font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
canvas { width:100%; display:block; background:#081724; }
.proc { display:grid; grid-template-columns:1fr 44px; gap:4px 8px; font-size:10px; margin-top:6px; } .proc i { display:block; height:3px; background:var(--lime); margin-top:2px; }
pre { background:#081724; border:1px solid var(--line); padding:9px; margin:0; max-height:340px; overflow:auto; font:10.5px/1.5 var(--fm); white-space:pre-wrap; color:#d6e3ea; }
.sim { display:grid; gap:4px; margin-top:8px; font-size:10px; } .sim div { display:flex; justify-content:space-between; gap:8px; } .sim b { color:var(--lime); }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) skewX(-8deg); background:var(--lime); color:#0a1a27; font-weight:900; padding:8px 18px; letter-spacing:.06em; opacity:0; pointer-events:none; transition:opacity .2s; }
.toast.on { opacity:1; }
@media (max-width:1100px) { main { grid-template-columns:1fr; } }
.stage { margin:12px 0 0; background:#081724; border:1px solid var(--line); position:relative; }
.stage canvas { background:transparent; }
.stc { display:flex; gap:8px; align-items:center; padding:6px 8px; border-top:1px solid var(--line); font-size:10px; color:var(--muted); font-weight:800; letter-spacing:.06em; }
.stc input[type=range] { flex:1; } .stc b { color:var(--lime); font-family:var(--fm); }
.stc label { display:flex; gap:4px; align-items:center; cursor:pointer; text-transform:uppercase; }
.ic { border:0; background:transparent; color:var(--cream); box-shadow:inset 0 0 0 1px var(--line); width:30px; height:28px; cursor:pointer; font-size:14px; }
.ic:hover { background:var(--lime); color:#0a1a27; } .ic:disabled { opacity:.3; pointer-events:none; }
.gcard { background:#cfd8e6; color:#0a1a27; padding:12px 16px 14px 18px; clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%); position:relative; margin:4px 0 12px; }
.gcard h4 { font:italic 900 24px/1 var(--fd); margin:0 0 6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.gcard .chips { display:flex; gap:5px; margin:0 0 8px; flex-wrap:wrap; }
.gcard .chip { font-weight:900; font-size:10px; padding:2px 8px; color:#fff; transform:skewX(-10deg); letter-spacing:.04em; }
.gcard p { margin:0 0 3px; font-weight:800; font-size:11.5px; line-height:1.4; } .gcard p.m { font-weight:700; color:#33414f; font-size:10.5px; }
.gcard .elx { width:20px; height:20px; transform:skewX(-10deg); display:inline-block; }
.slot { display:flex; gap:8px; align-items:center; background:#0a1a27; border-left:4px solid var(--el,#cbd5e1); padding:6px 9px; margin:0 0 10px; font-weight:900; }
.slot span { font-weight:700; color:var(--muted); margin-left:auto; font-size:10px; }
.verdict { padding:7px 9px; margin:0 0 8px; font-weight:800; font-size:11px; border-left:4px solid var(--lime); background:#0a1a27; }
.verdict.hi { border-color:var(--coral); } .verdict.lo { border-color:var(--cyan); } .verdict small { display:block; color:var(--muted); font-weight:600; }
.ov { position:fixed; inset:0; z-index:50; background:rgba(4,12,20,.88); display:flex; align-items:flex-start; justify-content:center; padding:24px; overflow:auto; }
.ov[hidden] { display:none; }
.ovb { background:#0a1a27; border:1px solid var(--line); width:min(1180px,100%); padding:16px 18px 20px; position:relative; }
.ovb h2 { margin:0 0 4px; font:italic 900 22px/1 var(--fd); color:var(--lime); }
.ovb .x2 { position:absolute; right:12px; top:10px; }
.rmxbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 12px; }
.rmxbar input[type=text] { width:200px; }
.rgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(176px,1fr)); gap:9px; }
.rc { background:#0d2233; border:1px solid var(--line); padding:0; cursor:pointer; text-align:left; color:var(--cream); font:inherit; display:flex; flex-direction:column; }
.rc:hover { border-color:var(--lime); transform:translateY(-2px); }
.rc .th { position:relative; aspect-ratio:16/9; background:#081724 no-repeat; border-bottom:1px solid var(--line); }
.rc .th img { position:absolute; left:5px; top:5px; width:20px; height:20px; padding:3px; background:var(--c); box-sizing:border-box; transform:skewX(-8deg); }
.rc .th img.cat2 { left:29px; background:#17324a; }
.rc .nm2 { font:italic 900 14px/1.15 var(--fd); padding:6px 8px 0; }
.rc .mt { font:800 9px var(--fb); letter-spacing:.08em; color:var(--lime); padding:2px 8px; text-transform:uppercase; }
.rc .tx { font:600 10px/1.35 var(--fb); color:var(--muted); padding:0 8px 8px; }
.pw { height:9px; background:#0a1a27; box-shadow:inset 0 0 0 1px var(--line); margin-top:4px; transform:skewX(-14deg); overflow:hidden; }
.pw i { display:block; height:100%; background:var(--lime); transition:width .15s; } .pw i.hi { background:#f7cb78; } .pw i.over { background:var(--coral); }
.warn { color:var(--coral); font:800 10px var(--fb); letter-spacing:.04em; align-self:center; }
.grp em { font-style:normal; color:var(--muted); font-weight:600; letter-spacing:0; text-transform:none; }
.sent { font:700 13px/2.1 var(--fb); align-items:center; gap:5px; }

.sent .ib img { width:18px; height:18px; padding:2px; box-sizing:border-box; background:var(--c); }

.mapw .pb { font:900 10px var(--fb); fill:var(--cream); }

.fam button.on { background:var(--lime); color:#0a1a27; box-shadow:none; }

<body>
<div class="bar"></div>
<header>
  <div><h1>MOVE <i>/</i><b>FORGE</b></h1><div class="sub">Monte um Move por blocos · exporte a ficha para implementar</div></div>
  <div class="sp"></div>
  <select id="preset" title="Carregar um Move do jogo como ponto de partida"></select>
  <button class="ic" id="btnUndo" title="Desfazer (Ctrl+Z)">↶</button><button class="ic" id="btnRedo" title="Refazer (Ctrl+Y)">↷</button>
  <button class="btn" id="btnRemix" title="Começar a partir de um Move do jogo, com o visual real">★ Começar de um Move</button>
  <button class="btn g" id="btnMap" title="Mapa de ramos: condições e chances deste Move">🗺 Mapa de ramos</button>
  <button class="btn g" id="btnDice" title="Sorteia uma ideia de Move com blocos que já existem no jogo">🎲 Sortear ideia</button>
  <button class="btn g" id="btnShelf" title="Guarda este Move na estante (fica neste navegador)">Guardar na estante</button>
  <button class="btn g" id="btnNew">Novo</button>
  <button class="btn c" id="btnPlay">▶ Encenar</button>
</header>
<main>
  <section class="pane" id="palette"><div class="pt">Blocos <small>ARRASTE OU CLIQUE</small></div></section>
  <section>
    <div class="head" id="head"></div>
    <div class="tl" id="tl"></div>
    <div class="stage"><canvas id="st" width="1120" height="300"></canvas>
      <div class="stc"><button class="ic" id="stPlay" title="Tocar / pausar (Espaço)">▶</button><button class="ic" id="stRoll" title="Nova rolagem dos gatilhos">⟳</button><input type="range" id="stT" min="0" max="1000" value="0" aria-label="Tempo"><b id="stClock">0.00s</b><label><input type="checkbox" id="stLoop" checked>repetir</label><span id="stInfo"></span></div>
    </div>
    <div id="lanes"></div>
  </section>
  <section class="pane">
    <div class="tabs" id="tabs"></div>
    <div id="tab"></div>
  </section>
</main>
<div class="ov" id="ov" hidden><div class="ovb" id="ovb"></div></div>
<div class="toast" id="toast"></div>
<script src="move_forge_data.js" onerror="window.MOVE_FORGE_DATA=null"></script>
<script src="vfx_previews.js" onerror="window.MOVE_FORGE_VFX=null"></script>
<script src="cost_model.js" onerror="window.MOVE_FORGE_COST=null"></script>
<script>
'use strict';
const D = window.MOVE_FORGE_DATA || { moves: [], vfx: { families: [], flipbooks: [], shaders: [], meshes: [], motion_behaviors: [] }, elements: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
