    import * as THREE from 'three';

    // =========================================================================
    // 1. PROCEDURAL WEBAUDIO SYNTHESIZER (ALL 6 MOVES SFX)
    // =========================================================================
    class NocturneAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playMediaWindup() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 987.77, 1174.66].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = i % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq * 0.5, now + i * 0.06);
          osc.frequency.exponentialRampToValueAtTime(freq, now + i * 0.06 + 0.45);
          gain.gain.setValueAtTime(0.0001, now + i * 0.06);
          gain.gain.linearRampToValueAtTime(0.05, now + i * 0.06 + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + 1.85);
        });
      }

      playMediaHealPulse() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        [587.33, 880, 1046.5, 1318.5, 1567.98, 2093.0].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const start = now + idx * 0.05;
          osc.frequency.setValueAtTime(freq, start);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.02, start + 0.55);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.045, start + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.9);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.95);
        });
      }

      playMabufulaBlizzard() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

    // =========================================================================
    // 2. PROCEDURAL TEXTURE ATLAS GENERATOR FOR QUARKS PARTICLES
    // =========================================================================
    function createParticleTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const cx = 64, cy = 64;

      if (type === 'glow') {
        const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 60);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.3, 'rgba(255,255,255,0.85)');
        grad.addColorStop(0.7, 'rgba(255,255,255,0.22)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 128, 128);
      } else if (type === 'sparkle') {
        const grad = ctx.createRadialGradient(cx, cy, 1, cx, cy, 58);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.25, 'rgba(255,255,255,0.68)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx, 4);
        ctx.quadraticCurveTo(cx + 6, cy - 6, 124, cy);
        ctx.quadraticCurveTo(cx + 6, cy + 6, cx, 124);
        ctx.quadraticCurveTo(cx - 6, cy + 6, 4, cy);
        ctx.quadraticCurveTo(cx - 6, cy - 6, cx, 4);
        ctx.closePath();
        ctx.fill();
      } else if (type === 'cross') {
        const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, 60);
        grad.addColorStop(0, 'rgba(255,255,255,0.95)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(cx - 10, 18, 20, 92);
        ctx.fillRect(18, cy - 10, 92, 20);
      } else if (type === 'shard') {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(cx, 8);
        ctx.lineTo(cx + 28, cy - 8);
        ctx.lineTo(cx + 16, 120);
        ctx.lineTo(cx - 22, cy + 18);
        ctx.closePath();
        ctx.fill();
      } else if (type === 'snowflake') {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI) / 3;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, -50);
          ctx.moveTo(0, -28);
          ctx.lineTo(-14, -40);
          ctx.moveTo(0, -28);
          ctx.lineTo(14, -40);
          ctx.stroke();
          ctx.restore();
        }
      } else if (type === 'rock') {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(28, 22);
        ctx.lineTo(88, 14);
        ctx.lineTo(114, 58);
        ctx.lineTo(92, 108);
        ctx.lineTo(38, 112);
        ctx.lineTo(14, 68);
        ctx.closePath();
        ctx.fill();
      } else if (type === 'smoke') {
        const grad = ctx.createRadialGradient(cx, cy, 6, cx, cy, 58);
        grad.addColorStop(0, 'rgba(255,255,255,0.85)');
        grad.addColorStop(0.55, 'rgba(255,255,255,0.38)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, 58, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === 'flame') {
        // Stylized tongue of fire / ember flake
        const grad = ctx.createRadialGradient(cx, cy + 8, 4, cx, cy, 56);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.5, 'rgba(255,255,255,0.7)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx, 6);
        ctx.quadraticCurveTo(cx + 42, cy - 4, cx + 26, 112);
        ctx.quadraticCurveTo(cx, 124, cx - 26, 112);
        ctx.quadraticCurveTo(cx - 42, cy - 4, cx, 6);
        ctx.closePath();
        ctx.fill();
      } else if (type === 'ash') {
        // Irregular charred flake for Splitter Flames ash dissipation
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(36, 28);
        ctx.lineTo(84, 24);
        ctx.lineTo(102, 66);
        ctx.lineTo(74, 98);
        ctx.lineTo(28, 86);
        ctx.closePath();
        ctx.fill();
      } else if (type === 'xmark') {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(26, 26);
        ctx.lineTo(102, 102);
        ctx.moveTo(102, 26);
        ctx.lineTo(26, 102);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    const PARTICLE_TEXTURES = {
      glow: createParticleTexture('glow'),
      sparkle: createParticleTexture('sparkle'),
      cross: createParticleTexture('cross'),
      shard: createParticleTexture('shard'),
      snowflake: createParticleTexture('snowflake'),

    // =========================================================================
    // 3. BUILT-IN QUARKS-ARCHITECTURE PARTICLE & SHADER MESH ENGINE
    // =========================================================================
    class QuarksVFXEngine {
      constructor(scene) {
        this.scene = scene;
        this.systems = [];
        this.meshes = [];
        this.activeParticlesCount = 0;
      }

      spawnEmitter(config) {
        const count = config.count || 60;
        const texture = PARTICLE_TEXTURES[config.texture || 'glow'];
        const blending = config.blending ?? THREE.AdditiveBlending;

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const sizes = new Float32Array(count);
        const alphas = new Float32Array(count);
        const angles = new Float32Array(count);

        const particles = [];
        const origin = config.origin ? config.origin.clone() : new THREE.Vector3();

        for (let i = 0; i < count; i++) {
          const p = this._initParticle(config, origin, i, count);
          particles.push(p);
          positions[i * 3] = p.pos.x;
          positions[i * 3 + 1] = p.pos.y;
          positions[i * 3 + 2] = p.pos.z;
          colors[i * 3] = p.colorStart.r;
          colors[i * 3 + 1] = p.colorStart.g;
          colors[i * 3 + 2] = p.colorStart.b;
          sizes[i] = p.sizeStart;
          alphas[i] = 0.0;
          angles[i] = p.angle;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        geometry.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));
        geometry.setAttribute('angle', new THREE.BufferAttribute(angles, 1));

        const material = new THREE.ShaderMaterial({
          uniforms: {
            uTexture: { value: texture }
          },
          vertexShader: `
            attribute float size;
            attribute float alpha;
            attribute float angle;
            attribute vec3 customColor;
            varying vec3 vColor;
            varying float vAlpha;
            varying float vAngle;
            void main() {
              vColor = customColor;
              vAlpha = alpha;
              vAngle = angle;
              vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
              gl_PointSize = clamp(size * (340.0 / max(0.1, -mvPosition.z)), 1.0, 220.0);
              gl_Position = projectionMatrix * mvPosition;
            }
          `,
          fragmentShader: `
            uniform sampler2D uTexture;
            varying vec3 vColor;
            varying float vAlpha;
            varying float vAngle;
            void main() {
              vec2 uv = gl_PointCoord - vec2(0.5);
              float c = cos(vAngle);
              float s = sin(vAngle);
              vec2 rotatedUV = vec2(uv.x * c - uv.y * s, uv.x * s + uv.y * c) + vec2(0.5);
              vec4 texColor = texture2D(uTexture, rotatedUV);
              if (texColor.a < 0.02) discard;
              gl_FragColor = vec4(vColor * texColor.rgb, texColor.a * vAlpha);
            }
          `,
          transparent: true,
          depthWrite: false,
          blending: blending
        });

        const points = new THREE.Points(geometry, material);
        points.frustumCulled = false;
        this.scene.add(points);

        const sys = {
          points,
          geometry,
          material,
          particles,
          config,
          age: 0
        };
        this.systems.push(sys);
        return sys;
      }

      _initParticle(config, origin, index, total) {
        const shape = config.shape || 'sphere';
        const pos = origin.clone();
        const vel = new THREE.Vector3();

        const radius = config.radius ?? 1.0;
        const speedMin = config.speed?.[0] ?? 1.0;
        const speedMax = config.speed?.[1] ?? 3.0;
        const spd = THREE.MathUtils.lerp(speedMin, speedMax, Math.random());

        let orbitAngle = (index / total) * Math.PI * 2 + Math.random() * 0.5;
        let orbitRadius = radius * (0.35 + 0.65 * Math.random());

        if (shape === 'circle' || shape === 'helix') {
          pos.x += Math.cos(orbitAngle) * orbitRadius;
          pos.z += Math.sin(orbitAngle) * orbitRadius;
          pos.y += (Math.random() - 0.5) * 0.3;
          vel.set(0, spd, 0);
        } else if (shape === 'inward') {
          // Singularity compression emitter (used in Dragon Rage windup)
          const u = Math.random() * Math.PI * 2;
          const v = (Math.random() - 0.5) * 2.0;
          const r = radius * (0.65 + 0.35 * Math.random());
          const offset = new THREE.Vector3(
            Math.cos(u) * Math.sqrt(1 - v * v) * r,
            v * r,
            Math.sin(u) * Math.sqrt(1 - v * v) * r
          );
          pos.add(offset);
          vel.copy(offset).normalize().multiplyScalar(-spd);
        } else if (shape === 'cone') {
          const theta = Math.random() * Math.PI * 2;
          const coneAngle = (config.coneAngle ?? 0.5) * Math.random();
          const dir = new THREE.Vector3(
            Math.sin(coneAngle) * Math.cos(theta),
            Math.cos(coneAngle),
            Math.sin(coneAngle) * Math.sin(theta)
          );
          if (config.direction) {
            const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), config.direction.clone().normalize());
            dir.applyQuaternion(q);
          }
          pos.addScaledVector(dir, Math.random() * radius);
          vel.copy(dir).multiplyScalar(spd);
        } else if (shape === 'hemisphere') {
          const u = Math.random();
          const v = Math.random();
          const theta = u * 2.0 * Math.PI;
          const phi = Math.acos(v);
          const dir = new THREE.Vector3(
            Math.sin(phi) * Math.cos(theta),
            Math.abs(Math.cos(phi)),
            Math.sin(phi) * Math.sin(theta)
          );
          pos.addScaledVector(dir, Math.random() * radius * 0.4);
          vel.copy(dir).multiplyScalar(spd);
        } else {
          const u = Math.random();
          const v = Math.random();
          const theta = u * 2.0 * Math.PI;
          const phi = Math.acos(2.0 * v - 1.0);
          const dir = new THREE.Vector3(
            Math.sin(phi) * Math.cos(theta),
            Math.cos(phi),
            Math.sin(phi) * Math.sin(theta)
          );
          pos.addScaledVector(dir, Math.random() * radius * 0.35);
          vel.copy(dir).multiplyScalar(spd);
        }

        const lifeMin = config.life?.[0] ?? 0.6;
        const lifeMax = config.life?.[1] ?? 1.4;

        return {
          origin: origin.clone(),
          pos,
          vel,
          orbitAngle,
          orbitRadius,
          orbitSpeed: config.orbitSpeed ?? 0,
          radialRate: config.radialRate ?? -0.25,
          gravity: config.gravity ?? 0,
          drag: config.drag ?? 0.98,
          delay: config.stagger ? (index / total) * config.stagger : (config.delay ?? 0) * Math.random(),
          age: 0,
          maxLife: THREE.MathUtils.lerp(lifeMin, lifeMax, Math.random()),
          sizeStart: THREE.MathUtils.lerp(config.size?.[0] ?? 0.6, config.size?.[1] ?? 1.4, Math.random()),
          colorStart: new THREE.Color(config.colorStart || '#ffffff'),
          colorMid: config.colorMid ? new THREE.Color(config.colorMid) : null,
          colorEnd: new THREE.Color(config.colorEnd || config.colorStart || '#ffffff'),
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * (config.spin ?? 4.0)
        };
      }

      spawnAnimatedMesh(mesh, duration, onUpdate, delay = 0) {
        mesh.visible = delay <= 0;
        this.scene.add(mesh);
        this.meshes.push({
          mesh,
          duration,
          delay,
          age: 0,
          onUpdate
        });
        return mesh;
      }

      update(dt) {
        let totalActive = 0;
        const tmpColor = new THREE.Color();

        for (let s = this.systems.length - 1; s >= 0; s--) {
          const sys = this.systems[s];
          sys.age += dt;

          const posAttr = sys.geometry.attributes.position;
          const colAttr = sys.geometry.attributes.customColor;
          const sizeAttr = sys.geometry.attributes.size;
          const alphaAttr = sys.geometry.attributes.alpha;
          const angleAttr = sys.geometry.attributes.angle;

          let aliveCount = 0;

          for (let i = 0; i < sys.particles.length; i++) {
            const p = sys.particles[i];
            if (sys.age < p.delay) {
              alphaAttr.array[i] = 0;
              aliveCount++;
              continue;
            }

            p.age += dt;
            const t = p.age / p.maxLife;

            if (t >= 1.0) {
              alphaAttr.array[i] = 0;
              continue;
            }

            aliveCount++;
            totalActive++;

            if (p.orbitSpeed !== 0) {
              p.orbitAngle += p.orbitSpeed * dt;
              const currentRad = Math.max(0.05, p.orbitRadius * (1.0 + p.radialRate * t));
              p.pos.x = p.origin.x + Math.cos(p.orbitAngle) * currentRad;
              p.pos.z = p.origin.z + Math.sin(p.orbitAngle) * currentRad;
              p.pos.y += p.vel.y * dt;
            } else {
              p.vel.y -= p.gravity * dt;
              p.vel.multiplyScalar(Math.pow(p.drag, dt * 60));
              p.pos.addScaledVector(p.vel, dt);
            }

            if (sys.config.bounceFloor && p.pos.y < 0.08 && p.vel.y < 0) {
              p.pos.y = 0.08;
              p.vel.y *= -0.45;
              p.vel.x *= 0.72;
              p.vel.z *= 0.72;
            }

            p.angle += p.spin * dt;

            // 3-stop or 2-stop ColorOverLife (allows Fire -> Charcoal Ash transition!)
            if (p.colorMid) {
              if (t < 0.5) {
                tmpColor.copy(p.colorStart).lerp(p.colorMid, t * 2.0);
              } else {
                tmpColor.copy(p.colorMid).lerp(p.colorEnd, (t - 0.5) * 2.0);
              }
            } else {
              tmpColor.copy(p.colorStart).lerp(p.colorEnd, t);
            }

            const sizeCurve = sys.config.sizeBell
              ? Math.sin(t * Math.PI)
              : (1.0 - Math.pow(t, 1.45));
            const alphaCurve = t < 0.14 ? (t / 0.14) : Math.pow(1.0 - (t - 0.14) / 0.86, 1.35);

            posAttr.array[i * 3] = p.pos.x;
            posAttr.array[i * 3 + 1] = p.pos.y;
            posAttr.array[i * 3 + 2] = p.pos.z;

            colAttr.array[i * 3] = tmpColor.r;
            colAttr.array[i * 3 + 1] = tmpColor.g;
            colAttr.array[i * 3 + 2] = tmpColor.b;

            sizeAttr.array[i] = Math.max(0.01, p.sizeStart * sizeCurve);
            alphaAttr.array[i] = Math.max(0, alphaCurve * (sys.config.opacity ?? 1.0));
            angleAttr.array[i] = p.angle;
          }

          posAttr.needsUpdate = true;
          colAttr.needsUpdate = true;
          sizeAttr.needsUpdate = true;
          alphaAttr.needsUpdate = true;
          angleAttr.needsUpdate = true;

          if (aliveCount === 0) {
            this.scene.remove(sys.points);
            sys.geometry.dispose();
            sys.material.dispose();
            this.systems.splice(s, 1);
          }
        }

        // Update Animated Shader Meshes
        for (let m = this.meshes.length - 1; m >= 0; m--) {
          const item = this.meshes[m];
          if (item.delay > 0) {
            item.delay -= dt;
            if (item.delay <= 0) item.mesh.visible = true;
            continue;
          }

          item.age += dt;
          const progress = Math.min(1.0, item.age / item.duration);
          if (item.onUpdate) item.onUpdate(progress, item.mesh, dt);

          if (item.age >= item.duration) {
            this.scene.remove(item.mesh);
            item.mesh.traverse((child) => {
              if (child.geometry) child.geometry.dispose();
              if (child.material) {
                if (Array.isArray(child.material)) child.material.forEach(mat => mat.dispose());
                else child.material.dispose();
              }
            });
            this.meshes.splice(m, 1);
          }
        }

        this.activeParticlesCount = totalActive;
      }
    }

    function createArenaGridTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const subCells = 8;
      const subSize = 1024 / subCells;

      for (let y = 0; y < subCells; y++) {
        for (let x = 0; x < subCells; x++) {
          ctx.fillStyle = (x + y) % 2 === 0 ? '#0d2232' : '#122c3f';
          ctx.fillRect(x * subSize, y * subSize, subSize, subSize);

          ctx.fillStyle = 'rgba(45, 226, 230, 0.22)';
          ctx.beginPath();
          ctx.arc((x + 0.5) * subSize, (y + 0.5) * subSize, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.strokeStyle = '#2de2e6';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, 1024, 1024);

      ctx.strokeStyle = 'rgba(45, 226, 230, 0.25)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(512, 0); ctx.lineTo(512, 1024);
      ctx.moveTo(0, 512); ctx.lineTo(1024, 512);
      ctx.stroke();

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(12, 12);
      texture.anisotropy = 8;
      return texture;
    }

    function spawnSacredHealCircle(centerPos, radius = 3.2, duration = 2.4) {
      const geo = new THREE.PlaneGeometry(radius * 2, radius * 2);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uProgress: { value: 0 },
          uColorPrimary: { value: new THREE.Color('#00ff9d') },
          uColorSecondary: { value: new THREE.Color('#d8ff00') }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv * 2.0 - 1.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uProgress;
          uniform vec3 uColorPrimary;
          uniform vec3 uColorSecondary;
          varying vec2 vUv;
          void main() {
            float r = length(vUv);
            if (r > 1.0) discard;
            float angle = atan(vUv.y, vUv.x);
            float ring1 = smoothstep(0.035, 0.0, abs(r - 0.92));
            float ring2 = smoothstep(0.025, 0.0, abs(r - 0.76));
            float ring3 = smoothstep(0.02, 0.0, abs(r - 0.45));
            float runeBand = step(0.77, r) * step(r, 0.90);
            float runes = step(0.2, sin(angle * 16.0 + uTime * 3.5)) * runeBand * 0.75;
            float starWave = abs(cos(angle * 4.0 - uTime * 2.0)) * 0.28 + 0.46;
            float starLine = smoothstep(0.028, 0.0, abs(r - starWave));
            float rippleRadius = fract(uTime * 0.85);
            float ripple = smoothstep(0.06, 0.0, abs(r - rippleRadius)) * (1.0 - rippleRadius);
            float pattern = ring1 + ring2 + ring3 + runes + starLine + ripple * 0.8;
            float softGlow = (1.0 - r) * 0.25;
            vec3 col = mix(uColorPrimary, uColorSecondary, starLine + runes);
            float fade = sin(clamp(uProgress * 3.14159, 0.0, 3.14159));
            float scaleIn = smoothstep(0.0, 0.18, uProgress);
            gl_FragColor = vec4(col * (pattern * 1.6 + softGlow), (pattern + softGlow) * fade * scaleIn);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.copy(centerPos);
      mesh.position.y = 0.04;

      vfx.spawnAnimatedMesh(mesh, duration, (progress, m, dt) => {
        mat.uniforms.uTime.value += dt;
        mat.uniforms.uProgress.value = progress;
        const s = progress < 0.2 ? THREE.MathUtils.lerp(0.2, 1.0, progress / 0.2) : 1.0;
        m.scale.setScalar(s);
      });
    }

    function spawnVolumetricHealPillar(targetPos, duration = 1.85, delay = 0.35) {
      const geo = new THREE.CylinderGeometry(1.25, 1.45, 7.5, 32, 1, true);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uProgress: { value: 0 },
          uColorBottom: { value: new THREE.Color('#00ff9d') },
          uColorTop: { value: new THREE.Color('#d8ff00') }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          void main() {
            vUv = uv;
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vNormal = normalize(normalMatrix * normal);
            vViewDir = normalize(-mvPos.xyz);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uProgress;
          uniform vec3 uColorBottom;
          uniform vec3 uColorTop;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          void main() {
            float vFade = pow(1.0 - vUv.y, 1.65) * smoothstep(0.0, 0.08, vUv.y);
            float fresnel = abs(dot(vNormal, vViewDir));
            float streaks = 0.55 + 0.45 * sin(vUv.x * 37.699 + uTime * 6.0 - vUv.y * 8.0);
            vec3 col = mix(uColorBottom, uColorTop, vUv.y * 0.7);
            float envelope = sin(uProgress * 3.14159);
            float alpha = vFade * fresnel * streaks * envelope * 0.68;
            gl_FragColor = vec4(col * 1.4, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(targetPos);
      mesh.position.y = 3.75;

      vfx.spawnAnimatedMesh(mesh, duration, (progress, m, dt) => {
        mat.uniforms.uTime.value += dt;
        mat.uniforms.uProgress.value = progress;
      }, delay);
    }

    function spawnCryoFrostDecal(centerPos, width = 14, depth = 5.5, duration = 2.4) {
      const geo = new THREE.PlaneGeometry(width, depth);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uProgress: { value: 0 },
          uColorCore: { value: new THREE.Color('#80f8ff') },
          uColorEdge: { value: new THREE.Color('#0077ff') }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv * 2.0 - 1.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uProgress;
          uniform vec3 uColorCore;
          uniform vec3 uColorEdge;
          varying vec2 vUv;
          void main() {
            float d = length(vUv * vec2(0.85, 1.15));
            if (d > 1.0) discard;
            float spread = smoothstep(0.0, 0.25, uProgress);
            if (d > spread) discard;
            float a = atan(vUv.y, vUv.x);
            float crystal = abs(sin(a * 6.0 + d * 10.0)) * abs(cos(a * 12.0 - d * 8.0));
            float veins = smoothstep(0.35, 0.85, crystal) * (1.0 - d * 0.7);
            float rim = smoothstep(0.08, 0.0, abs(d - spread * 0.95));
            vec3 col = mix(uColorEdge, uColorCore, veins + rim);
            float fadeOut = 1.0 - smoothstep(0.72, 1.0, uProgress);
            gl_FragColor = vec4(col * 1.4, (veins * 0.65 + rim * 0.9 + 0.15) * (1.0 - d) * fadeOut);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.copy(centerPos);
      mesh.position.y = 0.03;

      vfx.spawnAnimatedMesh(mesh, duration, (p, m, dt) => {
        mat.uniforms.uTime.value += dt;
        mat.uniforms.uProgress.value = p;
      });
    }

    function spawnGlacialSpireCluster(pos, scale = 1.0, delay = 0, shatterTime = 1.15) {
      const cluster = new THREE.Group();
      cluster.position.copy(pos);

      const iceMat = new THREE.ShaderMaterial({
        uniforms: {
          uColorDeep: { value: new THREE.Color('#0066cc') },
          uColorRim: { value: new THREE.Color('#b8ffff') },
          uOpacity: { value: 0.92 }
        },
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vViewDir;
          varying float vHeight;
          void main() {
            vHeight = position.y;
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vNormal = normalize(normalMatrix * normal);
            vViewDir = normalize(-mvPos.xyz);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColorDeep;
          uniform vec3 uColorRim;
          uniform float uOpacity;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          varying float vHeight;
          void main() {
            float fresnel = pow(1.0 - abs(dot(vNormal, vViewDir)), 1.6);
            float heightGlow = clamp(vHeight * 0.35, 0.0, 1.0);
            vec3 col = mix(uColorDeep, uColorRim, fresnel * 0.75 + heightGlow * 0.45);
            gl_FragColor = vec4(col * 1.35, uOpacity);
          }
        `,
        transparent: true,
        side: THREE.DoubleSide
      });

      [
        { r: 0.65, h: 3.6, x: 0, z: 0, rx: 0.08, rz: -0.05 },
        { r: 0.48, h: 2.6, x: -0.55, z: 0.35, rx: 0.22, rz: 0.32 },
        { r: 0.52, h: 2.8, x: 0.58, z: 0.25, rx: 0.18, rz: -0.35 },
        { r: 0.42, h: 2.2, x: -0.38, z: -0.52, rx: -0.28, rz: 0.22 },
        { r: 0.45, h: 2.4, x: 0.42, z: -0.45, rx: -0.25, rz: -0.28 }
      ].forEach(cfg => {
        const geo = new THREE.ConeGeometry(cfg.r * scale, cfg.h * scale, 5);
        geo.translate(0, (cfg.h * scale) / 2, 0);
        const spire = new THREE.Mesh(geo, iceMat);
        spire.position.set(cfg.x * scale, 0, cfg.z * scale);
        spire.rotation.set(cfg.rx, Math.random() * Math.PI, cfg.rz);
        cluster.add(spire);
      });

      vfx.spawnAnimatedMesh(cluster, shatterTime, (progress, m) => {
        if (progress < 0.18) {
          const t = progress / 0.18;
          const easeOutBack = 1 + 1.7 * Math.pow(t - 1, 3) + 0.7 * Math.pow(t - 1, 2);
          m.scale.set(1, Math.max(0.01, easeOutBack), 1);
        } else {
          const vib = progress > 0.75 ? (Math.random() - 0.5) * 0.12 : 0;
          m.position.x = pos.x + vib;
        }
      }, delay);
    }

    function spawnSeismicCraterDecal(pos, radius = 2.1, duration = 2.0) {
      const group = new THREE.Group();
      group.position.copy(pos);

      const geo = new THREE.PlaneGeometry(radius * 2.2, radius * 2.2);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uProgress: { value: 0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv * 2.0 - 1.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uProgress;
          varying vec2 vUv;
          void main() {
            float r = length(vUv);
            if (r > 1.0) discard;
            float a = atan(vUv.y, vUv.x);
            float abyss = smoothstep(0.55, 0.15, r);
            float cracks = smoothstep(0.12, 0.0, abs(sin(a * 7.0 + r * 6.0))) * smoothstep(0.95, 0.2, r);
            vec3 magma = mix(vec3(0.95, 0.45, 0.05), vec3(1.0, 0.85, 0.2), cracks);
            vec3 col = mix(magma * cracks * 1.6, vec3(0.05, 0.03, 0.02), abyss);
            float fade = 1.0 - smoothstep(0.75, 1.0, uProgress);
            float alpha = (abyss * 0.9 + cracks * 0.85) * fade;
            gl_FragColor = vec4(col, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const plane = new THREE.Mesh(geo, mat);
      plane.rotation.x = -Math.PI / 2;
      plane.position.y = 0.03;
      group.add(plane);

      // 3D Rim Rocks around the crater
      const rockMat = new THREE.MeshStandardMaterial({ color: '#5c4028', roughness: 0.85 });
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.26 + (i % 2) * 0.1, 0), rockMat);
        rock.position.set(Math.cos(ang) * (radius * 0.65), 0.14, Math.sin(ang) * (radius * 0.65));
        rock.rotation.set(i, i * 0.7, 0);
        group.add(rock);
      }

      vfx.spawnAnimatedMesh(group, duration, (p, m, dt) => {
        mat.uniforms.uTime.value += dt;
        mat.uniforms.uProgress.value = p;
      });
    }

    /**
     * Builds the Monstrous Draconic Fireball (Fornalha de FÃºria DracÃ´nica):
     * NO sci-fi rings! Instead:
     * - Violent spiky/horned GLSL vertex-displaced fireball with molten magma-white core,
     *   seething crimson-pink-magenta dragon fire (#ff0055 / #ff1e68), and abyssal dark-violet scorched edges (#2e0538)
     * - 10 protruding 3D jagged dragon-flame spikes/tongues whipping backwards
     * - Dynamic 3D jagged bio-lightning arcs snapping furiously around the mass
     */
    function createMonstrousDragonRageFireball() {
      const root = new THREE.Group();

      // 1. White-Gold-Crimson Incandescent Beast Core
      const innerCore = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.66, 3),
        new THREE.MeshBasicMaterial({ color: '#fff0d4' })
      );
      root.add(innerCore);

      // 2. Spiky, Roaring Draconic Fireball Shader Shell
      const monsterFireMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uColCore: { value: new THREE.Color('#ffea79') },   // White-hot / gold-pink core heat
          uColRage: { value: new THREE.Color('#ff0055') },   // Ferocious Dragon-Rage Crimson-Magenta
          uColPink: { value: new THREE.Color('#ff3385') },   // Intense Pink-Crimson Dragon Flame
          uColAbyss: { value: new THREE.Color('#24002e') }   // Dark Abyssal Dragon-Smoke Crust
        },
        vertexShader: `
          uniform float uTime;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          varying float vSpike;
          void main() {
            // High-frequency jagged flame-spike displacement (monstrous & feral)
            float f1 = sin(position.x * 5.5 - uTime * 18.0) * cos(position.y * 5.5 + uTime * 16.0);
            float f2 = sin(position.z * 7.5 - uTime * 22.0) * sin(position.x * 8.0 + uTime * 14.0);
            float spike = pow(abs(f1 * f2), 0.65) * sign(f1 + 0.2);
            vSpike = spike;

            // Stretch flames backward along +Z (comet tail effect)
            vec3 displaced = position + normal * (spike * 0.34);
            if (position.z < 0.0) {
              displaced.z *= 1.32;
            }
            vec4 mvPos = modelViewMatrix * vec4(displaced, 1.0);
            vNormal = normalize(normalMatrix * normal);
            vViewDir = normalize(-mvPos.xyz);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3 uColCore;
          uniform vec3 uColRage;
          uniform vec3 uColPink;
          uniform vec3 uColAbyss;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          varying float vSpike;
          void main() {
            float fresnel = 1.0 - abs(dot(vNormal, vViewDir));
            // Molten fissures vs dark draconic scale-crust
            vec3 fireCol = mix(uColRage, uColPink, smoothstep(-0.2, 0.45, vSpike));
            fireCol = mix(fireCol, uColCore, smoothstep(0.35, 0.85, vSpike) * (1.0 - fresnel * 0.6));
            // Charred abyssal purple-black rim & flame tips
            vec3 finalCol = mix(fireCol * 1.95, uColAbyss, pow(fresnel, 1.75) * 0.72);
            gl_FragColor = vec4(finalCol, 0.96);
          }
        `,
        transparent: true
      });

      const fireballMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.12, 4), monsterFireMat);
      root.add(fireballMesh);

      // 3. Jagged 3D Flame Tongues / Dragon Scale Spikes whipping around the fireball
      const flameSpikesGroup = new THREE.Group();
      root.add(flameSpikesGroup);

      const spikeMat = new THREE.MeshBasicMaterial({
        color: '#ff0055',
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });

      for (let i = 0; i < 12; i++) {
        const coneGeo = new THREE.ConeGeometry(0.28, 1.35, 4);
        coneGeo.translate(0, 0.65, 0);
        const cone = new THREE.Mesh(coneGeo, spikeMat);
        const angle = (i / 12) * Math.PI * 2;
        cone.position.set(Math.cos(angle) * 0.72, Math.sin(angle) * 0.72, -0.15);
        cone.rotation.x = -Math.PI * 0.38;
        cone.rotation.z = -angle + Math.PI / 2;
        flameSpikesGroup.add(cone);
      }

      // 4. Crackling 3D Draconic Bio-Lightning Arcs snapping across the fireball
      const lightningGroup = new THREE.Group();
      root.add(lightningGroup);
      const boltLines = [];
      for (let b = 0; b < 5; b++) {
        const pts = [];
        for (let s = 0; s < 7; s++) pts.push(new THREE.Vector3());
        const lGeo = new THREE.BufferGeometry().setFromPoints(pts);
        const lMat = new THREE.LineBasicMaterial({
          color: b % 2 === 0 ? '#ffd1e6' : '#ff0055',
          transparent: true,
          opacity: 0.95,
          blending: THREE.AdditiveBlending
        });
        const line = new THREE.Line(lGeo, lMat);
        lightningGroup.add(line);
        boltLines.push(line);
      }

      function updateLightning() {
        boltLines.forEach((line) => {
          const posArr = line.geometry.attributes.position.array;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          const rStart = 0.85;
          let cx = Math.sin(phi) * Math.cos(theta) * rStart;
          let cy = Math.cos(phi) * rStart;
          let cz = Math.sin(phi) * Math.sin(theta) * rStart;

          for (let s = 0; s < 7; s++) {
            posArr[s * 3] = cx;
            posArr[s * 3 + 1] = cy;
            posArr[s * 3 + 2] = cz;
            cx += (Math.random() - 0.5) * 0.75;
            cy += (Math.random() - 0.5) * 0.75;
            cz += (Math.random() - 0.5) * 0.75;
          }
          line.geometry.attributes.position.needsUpdate = true;
        });
      }

      return { root, monsterFireMat, flameSpikesGroup, updateLightning };
    }

    /**
     * Spawns a Scorched Molten Dragon-Fissure Ground Decal (Fissuras de FÃºria DracÃ´nica)
     */
    function spawnDraconicFissureDecal(pos, radius = 3.6, duration = 1.25) {
      const geo = new THREE.PlaneGeometry(radius * 2, radius * 2);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uProgress: { value: 0 },
          uColHot: { value: new THREE.Color('#ffea79') },
          uColRage: { value: new THREE.Color('#ff0055') },
          uColChar: { value: new THREE.Color('#14020c') }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv * 2.0 - 1.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uProgress;
          uniform vec3 uColHot;
          uniform vec3 uColRage;
          uniform vec3 uColChar;
          varying vec2 vUv;
          void main() {
            float r = length(vUv);
            if (r > 1.0) discard;
            float a = atan(vUv.y, vUv.x);
            // Jagged claw/fissure cracks radiating from impact center
            float branch = abs(sin(a * 9.0 + sin(r * 14.0 - uTime * 6.0) * 1.8));
            float crack = smoothstep(0.16, 0.0, branch) * smoothstep(0.98, 0.08, r);
            float charPool = smoothstep(0.85, 0.15, r);
            vec3 magma = mix(uColRage, uColHot, smoothstep(0.4, 0.95, crack) * (1.0 - r * 0.5));
            vec3 col = mix(uColChar, magma * 2.1, crack);
            float fade = 1.0 - smoothstep(0.68, 1.0, uProgress);
            float alpha = (charPool * 0.78 + crack * 0.95) * fade;
            gl_FragColor = vec4(col, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.copy(pos);
      mesh.position.y = 0.035;

      vfx.spawnAnimatedMesh(mesh, duration, (p, m, dt) => {
        mat.uniforms.uTime.value += dt;
        mat.uniforms.uProgress.value = p;
      });
    }

    function createGiantPinkPsychoOrbMesh() {
      const root = new THREE.Group();

      const innerCore = new THREE.Mesh(
        new THREE.SphereGeometry(0.68, 24, 24),
        new THREE.MeshBasicMaterial({ color: '#fff0f8' })
      );
      root.add(innerCore);

      const plasmaMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uColorCore: { value: new THREE.Color('#ffd6eb') },
          uColorMid: { value: new THREE.Color('#ff1f8e') },
          uColorRim: { value: new THREE.Color('#d946ef') }
        },
        vertexShader: `
          uniform float uTime;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          varying vec3 vPos;
          varying float vWave;
          void main() {
            vPos = position;
            float w = sin(position.x * 4.5 + uTime * 14.0)
                    * cos(position.y * 4.5 - uTime * 12.0)
                    * sin(position.z * 4.5 + uTime * 10.0);
            vWave = w;
            vec3 displaced = position + normal * (w * 0.14);
            vec4 mvPos = modelViewMatrix * vec4(displaced, 1.0);
            vNormal = normalize(normalMatrix * normal);
            vViewDir = normalize(-mvPos.xyz);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3 uColorCore;
          uniform vec3 uColorMid;
          uniform vec3 uColorRim;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          varying vec3 vPos;
          varying float vWave;
          void main() {
            float fresnel = 1.0 - abs(dot(vNormal, vViewDir));
            float veins = smoothstep(-0.25, 0.55, sin(vPos.x * 6.0 - uTime * 10.0) * cos(vPos.y * 6.0 + uTime * 9.0));
            vec3 col = mix(uColorMid, uColorCore, veins * 0.65 + (1.0 - fresnel) * 0.45);
            col = mix(col, uColorRim, pow(fresnel, 1.65));
            float alpha = clamp(0.78 + fresnel * 0.22 + vWave * 0.1, 0.0, 1.0);
            gl_FragColor = vec4(col * 1.75, alpha);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending
      });

      const outerSphere = new THREE.Mesh(new THREE.SphereGeometry(1.15, 32, 32), plasmaMat);
      root.add(outerSphere);

      const ringGeo = new THREE.TorusGeometry(1.38, 0.055, 12, 48);
      const ringMat = new THREE.MeshBasicMaterial({
        color: '#ff80ca',
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      const ringA = new THREE.Mesh(ringGeo, ringMat);
      ringA.rotation.x = Math.PI / 3;
      const ringB = new THREE.Mesh(ringGeo, ringMat);
      ringB.rotation.y = Math.PI / 3;
      root.add(ringA);
      root.add(ringB);

      return { root, plasmaMat, ringA, ringB };
    }

    function spawnPinkEnergyGroundRing(pos, radius = 2.8, duration = 0.85) {
      const geo = new THREE.PlaneGeometry(radius * 2, radius * 2);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uProgress: { value: 0 },
          uColInner: { value: new THREE.Color('#ffd6eb') },
          uColOuter: { value: new THREE.Color('#ff1f8e') }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv * 2.0 - 1.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uProgress;
          uniform vec3 uColInner;
          uniform vec3 uColOuter;
          varying vec2 vUv;
          void main() {
            float r = length(vUv);
            if (r > 1.0) discard;
            float ring1 = smoothstep(0.06, 0.0, abs(r - 0.85));
            float ring2 = smoothstep(0.05, 0.0, abs(r - fract(r * 2.0 - uTime * 3.0) * 0.8));
            float coreGlow = smoothstep(0.9, 0.0, r) * 0.45;
            vec3 col = mix(uColOuter, uColInner, ring1 + coreGlow);
            float env = sin(uProgress * 3.14159);
            gl_FragColor = vec4(col * 1.75, (ring1 + ring2 * 0.6 + coreGlow) * env);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.copy(pos);
      mesh.position.y = 0.04;

      vfx.spawnAnimatedMesh(mesh, duration, (p, m, dt) => {
        mat.uniforms.uTime.value += dt;
        mat.uniforms.uProgress.value = p;
      });
    }

    /**
     * Creates a Turbulent GLSL Fireball Mesh used for the Left and Right Projectiles
     */
    function createShaderFireballMesh() {
      const group = new THREE.Group();

      const coreMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: Math.random() * 10 },
          uColorCore: { value: new THREE.Color('#fffbeb') },
          uColorMid: { value: new THREE.Color('#ff9800') },
          uColorRim: { value: new THREE.Color('#e65100') }
        },
        vertexShader: `
          uniform float uTime;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          varying float vNoise;
          void main() {
            float n = sin(position.x * 6.0 + uTime * 14.0) * cos(position.y * 6.0 - uTime * 12.0);
            vNoise = n;
            vec3 displaced = position + normal * (n * 0.08);
            vec4 mvPos = modelViewMatrix * vec4(displaced, 1.0);
            vNormal = normalize(normalMatrix * normal);
            vViewDir = normalize(-mvPos.xyz);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColorCore;
          uniform vec3 uColorMid;
          uniform vec3 uColorRim;
          varying vec3 vNormal;
          varying vec3 vViewDir;
          varying float vNoise;
          void main() {
            float fresnel = 1.0 - abs(dot(vNormal, vViewDir));
            vec3 col = mix(uColorCore, uColorMid, clamp(fresnel * 1.3 + vNoise * 0.3, 0.0, 1.0));
            col = mix(col, uColorRim, pow(fresnel, 2.0));
            gl_FragColor = vec4(col * 1.65, 0.96);
          }
        `,
        transparent: true
      });

      const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 20), coreMat);
      group.add(sphere);

      return { group, coreMat };
    }

    /**
     * Spawns the Stationary Fire Vortex at the projectile origin upon Release
     * Spec: "No instante do disparo, surgem dois vÃ³rtices de fogo estacionÃ¡rios nos pontos de origem dos projÃ©teis.
     * Os vÃ³rtices se expandem durante 0,30 segundo e desaparecem suavemente."
     */
    function spawnStationaryOriginFireVortex(originPos, lookTarget) {
      const geo = new THREE.RingGeometry(0.18, 0.88, 32, 2);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uProgress: { value: 0 },
          uColorInner: { value: new THREE.Color('#ffeb3b') },
          uColorOuter: { value: new THREE.Color('#ff3d00') }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv * 2.0 - 1.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uProgress;
          uniform vec3 uColorInner;
          uniform vec3 uColorOuter;
          varying vec2 vUv;
          void main() {
            float r = length(vUv);
            float a = atan(vUv.y, vUv.x);
            float spiral = sin(a * 6.0 - r * 10.0 + uTime * 22.0);
            float mask = smoothstep(-0.2, 0.7, spiral);
            vec3 col = mix(uColorOuter, uColorInner, mask * (1.0 - r * 0.4));
            // Smooth fade-out over the 0.30s expansion
            float alpha = (1.0 - pow(uProgress, 1.4)) * (0.45 + 0.55 * mask);
            gl_FragColor = vec4(col * 1.75, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });

      const vortexMesh = new THREE.Mesh(geo, mat);
      vortexMesh.position.copy(originPos);
      vortexMesh.lookAt(lookTarget);

      // Exact 0.30 second expansion & smooth disappearance
      vfx.spawnAnimatedMesh(vortexMesh, 0.30, (p, m, dt) => {
        mat.uniforms.uTime.value += dt;
        mat.uniforms.uProgress.value = p;
        const scale = 0.45 + p * 2.15;
        m.scale.setScalar(scale);
        m.rotation.z += dt * 12.0;
      });

      // Swirling vortex embers at origin for 0.30s
      vfx.spawnEmitter({
        count: 26,
        texture: 'flame',
        shape: 'circle',
        origin: originPos.clone(),
        radius: 0.45,
        orbitSpeed: 10.0,
        radialRate: 1.4,
        speed: [0.3, 1.2],
        life: [0.18, 0.30],
        size: [0.35, 0.75],
        colorStart: '#ffeb3b',
        colorMid: '#ff5722',
        colorEnd: '#3f3f46'
      });
    }

        // Spawn the two stationary fire vortices at the projectile origins (0.30s expansion + smooth fade)
        spawnStationaryOriginFireVortex(leftOrigin, leftTargetInitial);
        spawnStationaryOriginFireVortex(rightOrigin, rightTargetInitial);

        // Construct Quadratic BÃ©zier curves:
        // Left ball bows wide to the LEFT; Right ball bows wide to the RIGHT
        const leftCtrl = leftOrigin.clone().lerp(leftTargetInitial, 0.5).add(new THREE.Vector3(-4.2, 1.35, 0));
        const rightCtrl = rightOrigin.clone().lerp(rightTargetInitial, 0.5).add(new THREE.Vector3(4.2, 1.35, 0));

        let leftCurve = new THREE.QuadraticBezierCurve3(leftOrigin.clone(), leftCtrl, leftTargetInitial);
        const rightCurve = new THREE.QuadraticBezierCurve3(rightOrigin.clone(), rightCtrl, rightTargetInitial);

        const flightDuration = 0.68;
        let retargetTriggered = false;
        let trailAccum = 0;

        const flightDummy = new THREE.Object3D();
        vfx.spawnAnimatedMesh(flightDummy, flightDuration, (p, m, dt) => {
          leftBall.coreMat.uniforms.uTime.value += dt;
          rightBall.coreMat.uniforms.uTime.value += dt;

          // Update 0.30s Vortex Timer Indicator on HUD
          const vortexTime = Math.min(0.30, p * flightDuration);
          castTimeNum.textContent = `VÃ“RTICE ${vortexTime.toFixed(2)}s / 0.30s`;

          // SPECIAL REDIRECTION RULE ("Se um dos alvos selecionados morrer durante o voo...")
          if (mode === 'retarget' && !retargetTriggered && p >= 0.42) {
            retargetTriggered = true;
            // Target 1 (Gible Alpha at Slot -2) dies mid-flight!
            combatState.enemies[1].hp = 0;
            combatState.enemies[1].model.shudderTimer = 0.4;
            document.getElementById('enemy-1-ko-pill').classList.remove('hidden');
            updateAllHUDs();
            spawnWorldPopup(ENEMY_SLOTS['-2'], 'MORTE EM VOO!', 'REDIRECIONANDO PROJÃ‰TIL ESQUERDO âž”', 'fire');

            // Dynamically rebuild Left Fireball curve from its current mid-air position to surviving Target 2 (Gible Beta at +2)
            const currentMidAirPos = leftBall.group.position.clone();
            const newRedirectCtrl = currentMidAirPos.clone().lerp(rightTargetInitial, 0.5).add(new THREE.Vector3(0, 2.2, -1.5));
            leftCurve = new THREE.QuadraticBezierCurve3(currentMidAirPos, newRedirectCtrl, rightTargetInitial.clone());
          }

          // Sample positions along curves
          const leftT = (mode === 'retarget' && retargetTriggered)
            ? Math.min(1.0, (p - 0.42) / 0.58)
            : p;
          const posL = leftCurve.getPoint(leftT);
          const posR = rightCurve.getPoint(p);

          leftBall.group.position.copy(posL);
          rightBall.group.position.copy(posR);

          // Continuous Flame Trail that cools & transforms into falling Charcoal Ashes
          trailAccum += dt;
          if (trailAccum >= 0.028) {
            trailAccum = 0;
            [posL, posR].forEach((ballPos) => {
              // Flame-to-Ash Trail Emitter
              vfx.spawnEmitter({
                count: 8,
                texture: 'flame',
                shape: 'sphere',
                origin: ballPos.clone(),
                radius: 0.22,
                speed: [0.4, 1.3],
                gravity: 2.2, // Ash sinks slowly
                life: [0.35, 0.68],
                size: [0.48, 0.85],
                blending: THREE.NormalBlending,
                colorStart: '#ffeb3b',
                colorMid: '#ff5722',
                colorEnd: '#27272a' // Residual flames turn into dark charcoal ash
              });
            });
          }
        });

        // =====================================================================
        // PHASE 3: IMPACT, PILLAR / INDIVIDUAL EXPLOSION, ASHES & BURN 4s
        // =====================================================================
        setTimeout(() => {
          scene.remove(leftBall.group);
          scene.remove(rightBall.group);
          castWidget.classList.add('hidden');

          if (mode === 'single') {
            // Single Target Convergence: Both trajectories cross at Gible 0 -> Pillar Explosion -> Ash Dissipation
            const hitPos = ENEMY_SLOTS['0'];
            spawnSplitterFireExplosion(hitPos, true);

            const en = combatState.enemies[0];
            en.hp = Math.max(0, en.hp - 30); // 20 + MAG(10) = 30
            en.model.shudderTimer = 0.65;
            applyBurnStatus(en);
            spawnWorldPopup(hitPos, '-30 HP', 'CONVERGÃŠNCIA EM PILAR â€¢ BURN (4s)', 'fire');
          } else if (mode === 'dual') {
            // Dual Target Split: Left hits Slot -2 (15 DMG), Right hits Slot +2 (15 DMG)
            const hitLeft = ENEMY_SLOTS['-2'];
            const hitRight = ENEMY_SLOTS['+2'];
            spawnSplitterFireExplosion(hitLeft, false);
            spawnSplitterFireExplosion(hitRight, false);

            [1, 2].forEach((enemyIdx) => {
              const en = combatState.enemies[enemyIdx];
              en.hp = Math.max(0, en.hp - 15); // (20 + MAG 10) / 2 = 15
              en.model.shudderTimer = 0.55;
              applyBurnStatus(en);
              spawnWorldPopup(en.slotPos, '-15 HP', 'IMPACTO DIVIDIDO â€¢ BURN (4s)', 'fire');
            });
          } else if (mode === 'retarget') {
            // Retarget Mode: Both balls converge onto surviving Gible Beta (+2) after Gible Alpha died mid-flight
            const hitSurviving = ENEMY_SLOTS['+2'];
            spawnSplitterFireExplosion(hitSurviving, true);

            const en = combatState.enemies[2];
            en.hp = Math.max(0, en.hp - 30);
            en.model.shudderTimer = 0.65;
            applyBurnStatus(en);
            spawnWorldPopup(hitSurviving, '-30 HP (2x HIT)', 'REDIRECIONAMENTO CONCLUÃDO â€¢ BURN (4s)', 'fire');
          }

          updateAllHUDs();
        }, (flightDuration * 1000) / combatState.timeScale);

        setTimeout(() => {
          setElementalVignette('', 0);
          fxLight.intensity = 0;
          combatState.isCasting = false;
        }, ((flightDuration + 1.1) * 1000) / combatState.timeScale);

      }, (windupDuration * 1000) / combatState.timeScale);
    }

    // =========================================================================
    // 14. UI EVENT BINDINGS & STUDIO CONTROLS
    // =========================================================================
    document.getElementById('btn-cast-media').addEventListener('click', castMedia);
    document.getElementById('btn-cast-mabufula').addEventListener('click', castMabufula);
    document.getElementById('btn-cast-dig').addEventListener('click', castDig);
    document.getElementById('btn-cast-sand').addEventListener('click', castSandAttack);
    document.getElementById('btn-cast-dragon').addEventListener('click', castDragonRage);
    document.getElementById('btn-cast-splitter').addEventListener('click', castSplitterFlames);
    document.getElementById('btn-cast-psychic').addEventListener('click', castPsychicCannon);
    document.getElementById('btn-cast-psycho-orb').addEventListener('click', castPsychoOrb);

    // Splitter Flames Sub-Mode Selector Buttons
    document.querySelectorAll('.splitter-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        combatState.splitterMode = btn.dataset.sfmode;
        document.querySelectorAll('.splitter-mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (combatState.splitterMode !== 'single' && !combatState.extraClonesActive) {
          setExtraClonesEnabled(true);
        }
      });
    });

    // Simulate Ally Damage Button
    document.getElementById('btn-sim-damage').addEventListener('click', () => {
      combatState.abraHp = Math.max(6, Math.floor(combatState.abraMaxHp * 0.35));
      combatState.panchamHp = Math.max(9, Math.floor(combatState.panchamMaxHp * 0.42));
      updateAllHUDs();
      triggerScreenFlash('#ff4d4d', 0.25, 110);
    });

    // Toggle Extra Enemy Targets (-2 / +2)
    document.getElementById('btn-toggle-clones').addEventListener('click', () => {
      setExtraClonesEnabled(!combatState.extraClonesActive);
    });

    // Time Scale Controls
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        combatState.timeScale = parseFloat(btn.dataset.speed);
        document.querySelectorAll('.speed-btn').forEach(b => {
          b.className = 'speed-btn px-1.5 py-0.5 text-slate-400 hover:text-white cursor-pointer';
        });
        btn.className = 'speed-btn px-1.5 py-0.5 bg-[#d8ff00] text-slate-950 font-extrabold cursor-pointer';
      });
    });

    // Auto-Loop Demo Toggle (Cycles Moves 1 -> 6)
    document.getElementById('btn-auto-loop').addEventListener('click', () => {
      combatState.autoLoop = !combatState.autoLoop;
      const txt = document.getElementById('loop-state-text');
      txt.textContent = combatState.autoLoop ? 'ON' : 'OFF';
      txt.className = combatState.autoLoop ? 'text-[#d8ff00]' : 'text-slate-400';
    });

    // SFX Toggle
    document.getElementById('btn-toggle-sfx').addEventListener('click', () => {
      sfx.enabled = !sfx.enabled;
      document.getElementById('sfx-state-text').textContent = sfx.enabled ? 'ON' : 'MUTE';
    });
    // Keyboard Shortcuts (1-8 = Moves, C = Cycle Static Camera Preset)
    window.addEventListener('keydown', (e) => {
      if (e.key === '1') castMedia();
      if (e.key === '2') castMabufula();
      if (e.key === '3') castDig();
      if (e.key === '4') castSandAttack();
      if (e.key === '5') castDragonRage();
      if (e.key === '6') castSplitterFlames();
      if (e.key === '7') castPsychicCannon();
      if (e.key === '8') castPsychoOrb();
      if (e.key.toLowerCase() === 'c') {
        const order = ['cinema', 'tatica', 'impacto'];
        const activeBtn = document.querySelector('.cam-btn.active');
        const current = activeBtn ? activeBtn.dataset.cam : 'cinema';
        const next = order[(order.indexOf(current) + 1) % order.length];
        setLockedCameraMode(next);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 15. MAIN 60FPS ANIMATION LOOP (LOCKED CAMERA + BURN 2 HP/S TICK ENGINE)
    // =========================================================================
    const clock = new THREE.Clock();

    function updateWorldSpaceEnemyHUDs() {
      combatState.enemies.forEach((en, idx) => {
        if (!en.active) return;
        const hudEl = document.getElementById(`enemy-hud-${idx}`);
        if (!hudEl) return;

        const worldPos = en.slotPos.clone();
        worldPos.y += 2.05 + en.model.knockupY;
        worldPos.project(camera);

        if (worldPos.z > 1) {
          hudEl.style.opacity = '0';
          return;
        }

        const x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-(worldPos.y * 0.5) + 0.5) * window.innerHeight;
        hudEl.style.opacity = '1';
        hudEl.style.left = `${x}px`;
        hudEl.style.top = `${y}px`;
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      const rawDt = Math.min(clock.getDelta(), 0.1);
      const dt = rawDt * combatState.timeScale;
      const elapsed = clock.getElapsedTime();

      // 1. Update Quarks VFX Engine
      vfx.update(dt);

      const ptclEl = document.getElementById('particle-count-readout');
      if (ptclEl) {
        ptclEl.textContent = `${vfx.activeParticlesCount} PTCL â€¢ ${vfx.systems.length} EMITTERS`;
      }

      // 2. Update Active Burn Status Effects (4.0s duration, fixed 2 HP/s tick)
      combatState.enemies.forEach((en) => {
        if (!en.active || en.burnRemaining <= 0) return;

        en.burnRemaining = Math.max(0, en.burnRemaining - dt);
        en.burnTickAccum += dt;

        const burnTxt = document.getElementById(`enemy-${en.id}-burn-text`);
        if (burnTxt) {
          burnTxt.textContent = `ðŸ”¥ BURN ${en.burnRemaining.toFixed(1)}s`;
        }

        // Every 1.0s elapsed, apply fixed 2 HP Burn tick + ember burst
        if (en.burnTickAccum >= 1.0) {
          en.burnTickAccum -= 1.0;
          if (en.hp > 0) {
            en.hp = Math.max(0, en.hp - 2);
            en.model.shudderTimer = 0.22;
            sfx.playBurnTick();
            updateAllHUDs();
            spawnWorldPopup(en.slotPos, '-2 HP', 'ðŸ”¥ BURN (2 HP/s)', 'fire');

            vfx.spawnEmitter({
              count: 20,
              texture: 'flame',
              shape: 'sphere',
              origin: en.slotPos.clone().add(new THREE.Vector3(0, 1.0, 0)),
              radius: 0.5,
              speed: [1.5, 3.8],
              life: [0.35, 0.65],
              size: [0.45, 0.85],
              colorStart: '#ffeb3b',
              colorMid: '#ff5722',
              colorEnd: '#27272a'
            });
          }
        }

        if (en.burnRemaining <= 0) {
          en.model.burnTint = 0;
          const pill = document.getElementById(`enemy-${en.id}-burn-pill`);
          if (pill) pill.classList.add('hidden');
        }
      });

      // 3. Auto-Loop Demo Logic across all 8 Moves
      if (combatState.autoLoop && !combatState.isCasting) {
        combatState.autoLoopTimer += rawDt;
        if (combatState.autoLoopTimer > 1.25) {
          combatState.autoLoopTimer = 0;
          const moves = [castMedia, castMabufula, castDig, castSandAttack, castDragonRage, castSplitterFlames, castPsychicCannon, castPsychoOrb];
          moves[combatState.autoSkillIndex % moves.length]();
          combatState.autoSkillIndex++;
        }
      }

      // 4. Animate Combatants (Idle Hover, Cast Pose, Knock-up Physics, Status Tints)
      if (abra.castAnimTimer > 0) {
        abra.castAnimTimer -= dt;
        abra.bodyGroup.position.y = 0.45 + Math.sin(elapsed * 8) * 0.08;
        abra.leftArm.rotation.x = 1.45;
        abra.rightArm.rotation.x = 1.45;
      } else {
        abra.bodyGroup.position.y = Math.sin(elapsed * 2.8) * 0.08;
        abra.tailGroup.rotation.y = Math.sin(elapsed * 2.2) * 0.12;
        abra.leftArm.rotation.x = THREE.MathUtils.lerp(abra.leftArm.rotation.x, 0.7, dt * 6);
        abra.rightArm.rotation.x = THREE.MathUtils.lerp(abra.rightArm.rotation.x, 0.7, dt * 6);
      }

      if (!pancham.customOverride) {
        pancham.bodyGroup.position.y = Math.abs(Math.sin(elapsed * 3.4)) * 0.06;
        pancham.bodyGroup.rotation.z = Math.sin(elapsed * 1.7) * 0.03;
      }

      combatState.enemies.forEach((en) => {
        if (!en.active) return;
        const m = en.model;

        // Vertical Knock-up Physics (from Dig uppercut)
        if (m.knockupVelY !== 0 || m.knockupY > 0) {
          m.knockupY += m.knockupVelY * dt;
          m.knockupVelY -= 22.0 * dt;
          if (m.knockupY <= 0) {
            m.knockupY = 0;
            m.knockupVelY = 0;
          }
        }

        if (m.shudderTimer > 0) {
          m.shudderTimer -= dt;
          m.bodyGroup.position.x = (Math.random() - 0.5) * 0.24;
          m.bodyGroup.position.z = (Math.random() - 0.5) * 0.18;
          m.bodyGroup.position.y = m.knockupY;
        } else {
          m.bodyGroup.position.x = 0;
          m.bodyGroup.position.z = 0;
          m.bodyGroup.position.y = m.knockupY + Math.sin(elapsed * 3.1 + en.id) * 0.04;
        }

        // Emissive Frost or Burn Tint on Enemy Materials
        m.materials.forEach(mat => {
          if (m.frozenTint > 0) {
            mat.emissive.set('#00a8ff');
            mat.emissiveIntensity = 0.55;
          } else if (m.burnTint > 0) {
            mat.emissive.set('#ff5722');
            mat.emissiveIntensity = 0.35 + 0.2 * Math.sin(elapsed * 10.0);
          } else {
            mat.emissiveIntensity = THREE.MathUtils.lerp(mat.emissiveIntensity || 0, 0, dt * 6);
          }
        });
      });

      // 5. Animate Floating Sky Cubes
      floatingCubes.forEach(fc => {
        fc.mesh.position.y = fc.baseY + Math.sin(elapsed * fc.speed + fc.phase) * 0.35;
        fc.mesh.rotation.y += dt * 0.25;
      });

      // 6. Project 3D Floating Enemy HUDs (Camera remains 100% locked!)
      updateWorldSpaceEnemyHUDs();

      // 7. Render Frame
      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    window.__atelier = { THREE, vfx, renderer, scene, camera, castMedia, spawnSacredHealCircle, spawnVolumetricHealPillar, ALLY_SLOTS, tick: (dt) => { vfx.update(dt); if (composer) composer.render(); else renderer.render(scene, camera); } };
    window.onload = () => {
      updateAllHUDs();
      animate();
    };
  </script>
</body>
</html>
