<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Move Sketch</title>
<style>
:root{--bg:#051322;--pan:#0a1929;--pan2:#0e2740;--pan3:#17375a;--lime:#d6fa66;--coral:#ff746c;--gold:#f0c57e;--cream:#f4eee1;--cyan:#63d9ec;--mut:#8fa3b8;--ink:#051322}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font:600 13px/1.35 system-ui,Segoe UI,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}
input[type=text]{background:var(--pan2);color:var(--cream);border:0;padding:7px 10px;width:150px;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
input[type=number]{background:var(--pan2);color:var(--cream);border:0;padding:4px 6px;width:64px}
select{background:var(--pan2);color:var(--cream);border:0;padding:5px}
input[type=range]{accent-color:var(--lime)}
.sk{clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);border:0;background:var(--pan2);color:var(--cream);padding:8px 16px;font:800 12px system-ui;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.sk:hover{background:var(--pan3)}
.sk.on{background:var(--lime);color:var(--ink)}
.sk.sm{padding:6px 11px;font-size:11px}
.sk:disabled{opacity:.35;cursor:default}
#vw{position:fixed;inset:0}
#v{position:absolute;inset:0}
#cap{position:absolute;left:78px;bottom:var(--tlh,170px);color:var(--mut);font-size:12px;pointer-events:none;margin-bottom:8px}
#msg{position:fixed;left:78px;top:92px;max-width:min(640px,calc(100vw - 420px));background:#051322d9;padding:8px 12px;pointer-events:none;font-size:13px;z-index:5;clip-path:polygon(0 0,100% 0,98% 100%,0 100%)}
#views{position:fixed;right:12px;top:66px;display:flex;flex-direction:column;gap:4px;z-index:6}
#hud{position:fixed;left:12px;right:12px;top:10px;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .bar{display:flex;gap:8px;align-items:center;background:var(--pan);padding:6px 14px 6px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
h1{margin:0;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);transform:skewX(-9deg);white-space:nowrap}
#types{display:flex;gap:3px}
#desc{color:var(--mut);font-weight:600;font-size:12px;max-width:520px}
#desc b{color:var(--gold)}
#slowbadge{position:fixed;left:50%;top:58px;transform:translateX(-50%) skewX(-9deg);background:var(--lime);color:var(--ink);font:900 12px system-ui;letter-spacing:.14em;padding:5px 18px;z-index:31;display:none;text-transform:uppercase}
#dock{position:fixed;left:8px;top:92px;z-index:30;display:flex;flex-direction:column;gap:5px}
#dock button{width:56px;padding:7px 2px 6px;font-size:9px;text-align:center;line-height:1.1;position:relative}
#dock button i{display:block;font-style:normal;font-size:15px;margin-bottom:1px}
#dock button.open::after{content:"";position:absolute;right:5px;top:4px;width:6px;height:6px;background:var(--lime)}
#dock button.open.on::after{background:var(--ink)}
.gadget{position:fixed;z-index:20;min-width:190px;max-width:96vw;background:#0a1929f5;color:var(--cream);transform:rotate(var(--tilt,0deg));transition:transform .2s,opacity .18s;display:none}
.gadget.show{display:block;animation:gin .22s ease-out}
@keyframes gin{from{opacity:0;transform:rotate(var(--tilt,0deg)) translateY(8px) scale(.96)}to{opacity:1}}
.gadget::before{content:"";position:absolute;inset:0;transform:translate(7px,7px);background:#02070d;z-index:-1}
.gadget:hover,.gadget.drag{transform:rotate(0deg)}
.gadget.drag{z-index:60}
.gh{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 14px;cursor:grab;background:var(--gc,var(--gold));color:var(--ink);font:800 11px system-ui;letter-spacing:.14em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);user-select:none;touch-action:none}
.gh b{flex:1;font-weight:800}
.gh button{border:0;background:#05132233;color:var(--ink);width:20px;height:20px;line-height:18px;font-weight:900;cursor:pointer;padding:0}
.gh button:hover{background:#051322aa;color:var(--cream)}
.gb{padding:10px 12px 14px;overflow:auto;max-height:calc(100vh - 200px)}
.gadget.min .gb{display:none}
.gadget.min .gr{display:none}
.gr{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;background:var(--gc,var(--gold));clip-path:polygon(100% 0,100% 100%,0 100%);opacity:.8}
.row{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.sw{width:10px;height:22px;transform:skewX(-9deg);flex:none}
.tr{flex:1;text-align:left;display:flex;justify-content:space-between;gap:8px}
.tr small{color:var(--mut);font-weight:600}
.tr.lock{opacity:.45;cursor:default}
.ph{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.ph .sk{flex:1;text-align:left}
.ph small{color:var(--mut)}
textarea{width:100%;height:170px;background:var(--bg);color:var(--cream);border:0;padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
.keys{color:var(--mut);font-size:11px;font-weight:600}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 8px}
.pal .sk{padding:4px 2px 5px;font-size:9px;text-align:center;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);display:flex;flex-direction:column;align-items:center;gap:1px}
.pal .sk img{width:100%;max-width:64px;height:auto;display:block}
.fld{display:flex;align-items:center;gap:8px;margin:0 0 5px;font-size:11px;color:var(--mut)}
.fld label{width:92px;flex:none}
.fld input[type=range]{flex:1;min-width:0}
.fld output{width:38px;text-align:right;color:var(--cream)}
.lyr{display:flex;align-items:center;gap:4px;margin:0 0 2px;padding:3px 4px;border-radius:6px;border:1px solid transparent;cursor:pointer}
.lyr:hover{background:rgba(255,255,255,.05)}.lyr.on{border-color:#b79cff;background:rgba(183,156,255,.14)}.lyr.off .ln{opacity:.4;text-decoration:line-through}
.lyr .ln{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lyr .sw{width:10px;height:10px;border-radius:3px;flex:none}
.lyr .lb{background:none;border:1px solid #2c4a68;color:#cfe0f0;border-radius:4px;padding:0 5px;font-size:11px;line-height:18px;cursor:pointer}.lyr .lb.on{background:#b79cff;color:#10202f;border-color:#b79cff}
.lyr input{flex:1;min-width:0}#triad{position:fixed;right:14px;top:262px;width:140px;height:140px;pointer-events:none;z-index:6;background:rgba(10,24,40,.6);border:1px solid #2c4a68;border-radius:10px}
.subtabs{display:flex;gap:3px;flex-wrap:wrap;margin:0 0 8px;border-bottom:1px solid #1d3550;padding-bottom:6px}.subtabs .sub{background:#0e2740;border:1px solid #2c4a68;color:#cfe0f0;border-radius:6px 6px 0 0;padding:3px 8px;font-size:11px;cursor:pointer}.subtabs .sub.on{background:#d6fa66;color:#10202f;border-color:#d6fa66}
.lysec{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8fa3b8;margin:8px 0 3px}
.shr{display:flex;align-items:center;gap:6px;margin:0 0 3px}
.shr .sk{flex:1;text-align:left}
.hl{margin:10px 0 4px;color:var(--gold);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.hist{display:flex;align-items:center;gap:6px;margin:0 0 2px;padding:3px 6px;cursor:pointer;color:var(--mut);font-size:12px}
.hist:hover{background:var(--pan2)}
.hist.cur{background:var(--lime);color:var(--ink);font-weight:800}
.hist.fut{opacity:.45}
.hist small{margin-left:auto}
#tlw{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--pan);padding:6px 16px 8px 70px}
#tlc{min-width:0}
#tl{width:100%;display:block;cursor:pointer}
#tm{position:absolute;right:16px;top:-24px;background:var(--pan);color:var(--lime);font-size:12px;padding:3px 14px 3px 12px;clip-path:polygon(0 0,100% 0,100% 100%,10px 100%)}
#tlt{position:absolute;left:70px;top:-24px;background:var(--pan);color:var(--mut);border:0;font:800 10px system-ui;letter-spacing:.12em;text-transform:uppercase;padding:4px 16px 4px 12px;cursor:pointer;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
#tlw.fold #tlc{display:none}
#tlw.fold{padding-top:2px;padding-bottom:2px}
@media (prefers-reduced-motion:reduce){.gadget.show{animation:none}.gadget{transition:none}}
</style>
</head>
<body>
<div id="vw"><div id="v"></div><div id="cap">Esquerdo: desenhar · Direito: girar · Roda: zoom · H: esconde os gadgets</div></div>
<div id="msg"></div>
<div id="views"></div>
<div id="slowbadge"></div>
<div id="hud">
  <div class="bar"><h1>Move Sketch</h1><input type="text" id="name" value="New Move" aria-label="Nome do Move"></div>
  <div class="bar"><div id="types"></div></div>
  <div class="bar"><button class="sk sm" id="undo" title="Desfazer (Ctrl+Z)">↶ Desfazer</button><button class="sk sm" id="redo" title="Refazer (Ctrl+Shift+Z)">Refazer ↷</button></div>
  <div id="desc"></div>
</div>
<nav id="dock" aria-label="Gadgets"></nav>

<section class="gadget" data-id="phases" data-title="Fases" data-color="#f0c57e"><div id="phases"></div></section>
<section class="gadget" data-id="tracks" data-title="Trilhas" data-color="#63d9ec"><div id="tracks"></div><div id="extra"></div><div id="extra2"></div>
  <div class="row" style="margin-top:8px"><button class="sk sm" id="delc">Apagar célula</button><button class="sk sm" id="clr">Limpar tudo</button></div></section>
<section class="gadget" data-id="shapes" data-title="Formas" data-color="#d6fa66"><div id="shapes"></div></section>
<section class="gadget" data-id="props" data-title="Ajustes da forma" data-color="#ff746c"><div id="shprops"></div></section>
<section class="gadget" data-id="player" data-title="Reprodutor" data-color="#d6fa66"><div id="player"></div></section>
<section class="gadget" data-id="history" data-title="Histórico" data-color="#b79cff"><div id="histlist"></div></section>
<section class="gadget" data-id="graph" data-title="Velocidade" data-color="#63d9ec"><canvas id="spdc" width="320" height="120" style="width:100%;display:block"></canvas><div class="keys" id="spdnote"></div></section>
<section class="gadget" data-id="pip" data-title="Câmera 2" data-color="#f0c57e"><div class="row" id="pipviews"></div><div id="pipwrap"></div></section>
<section class="gadget" data-id="layers" data-title="Camadas" data-color="#b79cff"><div id="layers"></div></section>
<section class="gadget" data-id="tut" data-title="Tutorial · criar um Move" data-color="#d6fa66"><div id="tutbox"></div></section>
<section class="gadget" data-id="pts" data-title="Pontos e trilha" data-color="#7dff7d"><div id="ptsbox"></div></section>
<section class="gadget" data-id="lib" data-title="Biblioteca · efeitos e Moves salvos" data-color="#f0c57e"><div id="libbox"></div></section>
<section class="gadget" data-id="tele" data-title="Telemetria" data-color="#63d9ec"><div id="telebox"></div></section>
<section class="gadget" data-id="export" data-title="Exportar para a IA" data-color="#ff746c">
  <div class="row"><button class="sk sm on" id="tabB">Briefing</button><button class="sk sm" id="tabJ">JSON</button><button class="sk sm" id="tabG">GDScript</button></div>
  <div class="row" style="margin:6px 0"><select id="expscope" title="O que exportar"></select></div>
  <textarea id="out" readonly></textarea>
  <div class="row" style="margin-top:6px"><button class="sk sm" id="cpy">Copiar</button><button class="sk sm" id="dl">Baixar arquivo</button></div>
  <div id="imgx"></div></section>

<canvas id="triad" width="220" height="220"></canvas>
<div id="tlw"><button id="tlt">Linha do tempo ▾</button><div id="tm"></div><div id="tlc"><canvas id="tl"></canvas></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script src="modules/parts.js"></script>
<script src="modules/history.js"></script>
<script src="modules/playback.js"></script>
<script src="modules/pathfollow.js"></script>
<script src="modules/shapes_extra.js"></script>
<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const STAND=1.7, AX=-2.5, UNIT=5, HGT=1.6;
/* Fases (D-308: windup/release/trajeto/impacto; D-956: Start e Post-impact para projétil; motor: travel/strike/return, AGENTS §9.2).
   Todas ficam disponíveis; o conjunto LIGADO por tipo é recomendação da IA, o criador liga/desliga por Move. */
const PH=[['start','#8fa3b8',150],['windup','#f0c57e',400],['release','#ff746c',120],['travel','#63d9ec',300],['prelude','#ffa94d',250],['strike','#b79cff',150],['impact','#d6fa66',260],['post','#7fd18b',200],['return','#c9b8a0',400]];
const I_TRAVEL=3, I_RET=8;
const NPH=PH.length, PH_ID=PH.map(p=>p[0]), PH_COL=PH.map(p=>p[1]);
const PHINFO=['o efeito que dispara o wind-up (D-956)','carga e recuo antes do golpe','o instante em que a ação é solta','o caminho: corpo, golpe ou projétil até o alvo','o prelúdio do ataque (Hit-windup, D-953/D-990): a pose de preparo ao chegar; é a janela do Evade (D-987: 0,25 s)','o golpe em si, do prelúdio até o contato (motor: STRIKE)','o contato e o efeito no alvo','a dissipação do impacto (D-956)','a volta ao lugar de origem (motor: RETURN)'];
const TRAVEL_NAME={melee:'Approach',mid:'Approach',long:'Trajectory',status:'Effect'};
const phName=i=>['Start','Wind-up','Release',TRAVEL_NAME[S.type],'Prelude','Strike','Impact','Post-impact','Return'][i];
const DEF_ON={melee:[1,2,3,4,5,6,8],mid:[1,2,3,4,5,6,8],long:[0,1,2,3,6,7],status:[1,2,3,6]};
const defOn=k=>PH.map((_,i)=>DEF_ON[k].includes(i));
const TYPES={
 melee:{label:'Melee',kind:'MELEE',moves:true,tracks:['body','handR','handL','weapon','fx'],
  desc:'<b>O boneco SE DESLOCA</b> até o alvo. O corpo vai reto até ele; desenhe a mão, a arma e o efeito.'},
 mid:{label:'Mid-range',kind:'CAST',moves:true,tracks:['body','handR','handL','weapon','fx'],
  desc:'<b>O boneco SE DESLOCA</b>, mas para a uma distância maior do alvo (D-1194). Ajuste onde ele para.'},
 long:{label:'Long range',kind:'PROJECTILE',moves:false,tracks:['handR','handL','proj'],
  desc:'<b>O boneco FICA PARADO.</b> Um projétil voa até o alvo; desenhe a trajetória dele.'},
 status:{label:'Status',kind:'STATUS',moves:false,tracks:['handR','handL','fx'],
  desc:'<b>Sem dano e sem deslocamento.</b> Desenhe o gesto e o efeito em quem recebe.'}
};
const TR={
 body:{n:'Corpo',c:'#f4eee1',a:[AX,.8,0]},
 handR:{n:'Mão direita',c:'#ff746c',a:[-2.15,1.05,.32]},
 handL:{n:'Mão esquerda',c:'#63d9ec',a:[-2.15,1.05,-.32]},
 weapon:{n:'Arma / membro',c:'#f0c57e',a:[-2.05,1.15,.4]},
 fx:{n:'Efeito',c:'#d6fa66',a:[-1.95,1.2,0]},
 proj:{n:'Projétil',c:'#d6fa66',a:[-1.95,1.2,0]}
};
const WHO={self:'o próprio usuário',ally:'um aliado',enemy:'o inimigo'};
const VIEWS={side:['Lateral',[0,1.2,9.5]],top:['De cima',[0,11,.01]],front:['De frente',[10,1.2,0]],free:['Livre',[-4.5,3.5,8]]};
const KEY='move_sketch_v4';
let H=null,histLabel='Alteração',histKey=null,histMute=false;
const act=(l,k)=>{histLabel=l;histKey=k||null};
const viewPos=k=>{const p=[...VIEWS[k][1]];if(S.mirror){p[0]=-p[0];p[2]=-p[2]}return p};

const sSer=s=>({bz:s.bz?s.bz.map(a=>({p:[a.p.x,a.p.y,a.p.z],hi:[a.hi.x,a.hi.y,a.hi.z],ho:[a.ho.x,a.ho.y,a.ho.z]})):undefined,id:s.id,name:s.name,hid:s.hid||undefined,lock:s.lock||undefined,track:s.track,ph:s.ph,pts:s.pts.map(q=>[+q.v.x.toFixed(4),+q.v.y.toFixed(4),+q.v.z.toFixed(4),Math.round(q.t-s.pts[0].t)])});
const sDes=s=>({bz:s.bz?s.bz.map(a=>({p:new THREE.Vector3(...a.p),hi:new THREE.Vector3(...a.hi),ho:new THREE.Vector3(...a.ho)})):undefined,id:s.id,name:s.name,hid:s.hid,lock:s.lock,track:s.track,ph:s.ph,pts:s.pts.map(q=>({v:new THREE.Vector3(q[0],q[1],q[2]),t:q[3]}))});
function fresh(){return{name:'New Move',type:'melee',ms:PH.map(p=>p[2]),on:defOn('melee'),strokes:[],autoBody:true,ground:false,who:'self',track:'handR',ph:1,view:'side'}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(!j)return null;
 j.strokes=(j.strokes||[]).map(sDes);return Object.assign(fresh(),j)}catch(e){return null}}
let S=load()||fresh();
if(!Array.isArray(S.on)||S.on.length!==NPH)S.on=defOn(S.type);if(!Array.isArray(S.ms)||S.ms.length!==NPH)S.ms=PH.map(p=>p[2]);
S.shapes=S.shapes||[];S.shapes.forEach(s=>{s.parts=s.parts||{n:1,mode:'radial',stagger:'none'};if(s.align===undefined)s.align=false;if(!s.anims)s.anims=[];if(!s.face)s.face=s.align?'tangent':'none';if(!s.faceAxis)s.faceAxis='x';if(s.trail===undefined)s.trail=0;if(!s.lag)s.lag=60;[s.k0,s.k1].forEach(k=>{if(!k.d)k.d={sep:0,sh:0,sv:0}})});S.nid=S.nid||1;S.mode=S.mode||'stroke';S.pal=S.pal||null;S.sel=S.sel||null;S.key=S.key||'start';S.gizmo=S.gizmo||'translate';
function ensureIds(){S.strokes.forEach(s=>{if(!s.id)s.id=S.nid++})}ensureIds();
S.stop=Object.assign({melee:.84,mid:.6},S.stop||{});S.pinf=Object.assign({mode:'one',n:4},S.pinf);S.yaw=S.yaw||[];S.react=S.react||[];S.cues=S.cues||[];S.snap=S.snap||0; // fração do caminho atacante→alvo; valores de trabalho da IA, não decididos
function save(){try{ensureIds();const o=Object.assign({},S,{strokes:S.strokes.map(sSer)});localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}
 if(H&&!histMute){H.commit(histLabel,histKey);histLabel='Alteração';histKey=null;if(typeof renderHist==='function')renderHist()}}
const avail=()=>TYPES[S.type].tracks;
const dur=i=>S.on[i]?S.ms[i]:0;
const enabled=()=>PH.map((_,i)=>i).filter(i=>S.on[i]);
const starts=()=>{const s=[0];for(let i=0;i<NPH;i++)s.push(s[i]+dur(i));return s};
const totalMs=()=>starts()[NPH];

/* ---------- caminhos por célula (trilha x fase) ---------- */
let cache={};
function getCell(track,ph){const k=track+'|'+ph;if(k in cache)return cache[k];
 const ss=S.strokes.filter(s=>s.track===track&&s.ph===ph);if(!ss.length)return cache[k]=null;
 const pts=[];let acc=0;
 ss.forEach(s=>s.pts.forEach((q,i)=>{if(i)acc+=Math.max(1,q.t-s.pts[i-1].t);pts.push({v:q.v,a:acc})}));
 const tot=Math.max(1,acc);pts.forEach(p=>p.u=p.a/tot);return cache[k]=pts}
function interp(c,u){let i=0;while(i<c.length-2&&c[i+1].u<u)i++;const a=c[i],b=c[Math.min(i+1,c.length-1)];
 const k=b.u>a.u?clamp((u-a.u)/(b.u-a.u)):0;return a.v.clone().lerp(b.v,k)}
function phaseAt(t){const st=starts(),e=enabled();let p=e[0];for(const i of e)if(t>=st[i])p=i;return{p,u:clamp((t-st[p])/S.ms[p])}}
function pos(track,t){const {p,u}=phaseAt(t);const c=getCell(track,p);if(c)return interp(c,u);
 const e=enabled(),k=e.indexOf(p);
 for(let q=k-1;q>=0;q--){const d=getCell(track,e[q]);if(d)return d[d.length-1].v.clone()}
 for(let q=k+1;q<e.length;q++){const d=getCell(track,e[q]);if(d)return d[0].v.clone()}
 return null}
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
function bodyAt(t){if(!TYPES[S.type].moves)return new THREE.Vector3(AX,0,0);
 const p=pos('body',t);if(p)return new THREE.Vector3(p.x,Math.max(0,p.y-.8),p.z);

 {t:'Camadas: nomes e travar',body:'Gadget Camadas: renomeie (duplo clique), oculte, trave e reordene formas e trilhas; "Isolar" mostra só o selecionado. Aqui o Núcleo (pronto) é travado para não mexer sem querer.',go:{g:'layers'},do:()=>{const n=shN('Núcleo');T_('layer.set',{kind:'shape',id:n.id,lock:true})},check:()=>!!shN('Núcleo')&&!!shN('Núcleo').lock},
 {t:'Salvar como preset',body:'Gadget Formas → Presets: guarda a forma inteira (animações, afinação, partes...) para reutilizar em outros Moves.',go:{g:'shapes',ut:{shp:'Presets'}},do:()=>tutPreset(shN('Núcleo').id,'Tutorial · Núcleo'),check:()=>PRS.some(p=>p.name==='Tutorial · Núcleo')},
 {t:'Reproduzir e conferir',body:'Espaço reproduz; ← → andam quadro a quadro; o gadget Player tem câmera lenta e laço. Confira cada fase.',go:{g:'player'},do:()=>{TUTF.played=true;T_('seek',{ms:300})},check:()=>TUTF.played},
 {t:'Exportar a referência (imagem + código)',body:'Gadget Exportar → "Exportar imagem": spritesheet PNG ou GIF de TODOS os ângulos, com metadados e o código (GDScript/JSON/Briefing) num .zip. É o pacote para a IA implementar o Move.',go:{g:'export'},do:async()=>{const r=await TEL.capture({scope:'scene',fmt:'sheet',angles:'all',nf:6,size:128,zip:true,code:'all'});if(!r.ok)throw new Error(r.error)},check:()=>TUTF.exported}
]},
{id:'melee',name:'2 · Golpe melee completo',type:'Melee',intro:'Um corte em arco com investida: o corpo se desloca até o alvo, a arma desenha um arco, o golpe deixa um rastro, levanta poeira e termina numa explosão de faíscas. Cobre corpo, arma, mão, efeito, curvas, afinação, esticar, partes, alinhamentos e exportação.',steps:[
 {t:'Novo projeto: tipo Melee',body:'Melee = o corpo SE DESLOCA até o alvo. Fases: Wind-up, Release, Approach, Prelude, Strike, Impact e Return.',go:{mode:'stroke'},do:()=>tutReset('melee','Tutorial · Corte em arco'),check:()=>S.type==='melee'},
 {t:'Tempo das fases',body:'Gadget Fases: carga 420, soltar 120, investida 260, preparo 180, golpe 140, impacto 260, volta 380 (valores de demonstração).',go:{g:'phases'},do:()=>{[[1,420],[2,120],[3,260],[4,180],[5,140],[6,260],[8,380]].forEach(([i,ms])=>T_('phase.ms',{index:i,ms}))},check:()=>S.ms.some((v,i)=>S.on[i]&&v!==PH[i][2])},
 {t:'Onde o corpo para',body:'Gadget Trilhas: "Parar a X% do caminho até o alvo". É a distância em que o boneco para antes de bater (valores de trabalho; a distância real vem da ficha do Move).',go:{g:'tracks'},do:()=>{S.stop.melee=.8;save();ui()},check:()=>Math.abs(S.stop.melee-.84)>.001},
 {t:'Trilha do corpo (opcional)',body:'Sem desenho o corpo vai reto. Desenhe a trilha Corpo na fase Approach para uma investida em curva.',go:{mode:'pen',track:'body',ph:3},do:()=>mkPen('body',3,[{p:[0,.5,0]},{p:[.38,.5,.1],hi:[.25,.5,.1],ho:[.5,.5,.1]},{p:[.8,.5,0]}]),check:()=>stk('body',3).some(q=>q.bz)},
 {t:'Arma: levantar e golpear',body:'Trilha Arma / membro: no Wind-up a arma sobe atrás; no Strike faz o arco principal (coordenadas perto do alvo, porque o corpo já chegou). Mão direita acompanha.',go:{mode:'pen',track:'weapon',ph:5},do:()=>{mkPen('weapon',1,[{p:[.06,.7,.12]},{p:[.0,1.05,.15],hi:[.0,.9,.14],ho:[.0,1.15,.15]},{p:[-.02,1.2,.1]}]);mkPen('weapon',5,[{p:[.8,1.15,.18]},{p:[.9,.9,-.02],hi:[.84,1.05,.1],ho:[.95,.75,-.1]},{p:[.86,.35,-.2]}]);mkPen('handR',5,[{p:[.79,1.05,.1]},{p:[.84,.62,-.05]}])},check:()=>stk('weapon',1).length>0&&stk('weapon',5).some(q=>q.bz)&&stk('handR',5).length>0},
 {t:'Efeito: faíscas no impacto',body:'Trilha Efeito (fase Impact): o caminho do efeito no alvo. Uma forma pode seguir essa trilha.',go:{mode:'pen',track:'fx',ph:6},do:()=>mkPen('fx',6,[{p:[.98,.4,0]},{p:[1,.9,0],hi:[.99,.6,0]}]),check:()=>stk('fx',6).length>0},
 {t:'Ajustar os pontos do arco',body:'Modo Pontos: arraste a âncora do meio do arco da arma. "Vizinhos (suave)" faz os pontos próximos acompanharem.',go:{mode:'path',pick:['weapon',5]},do:()=>{const q=stk('weapon',5)[0];if(q.bz.length<4)T_('stroke.op',{id:q.id,op:'insert',after:0});const n=nz(q.bz[1].p);T_('stroke.op',{id:q.id,op:'point',index:1,pos:[n[0]+.01,n[1]+.04,n[2]],norm:true})},check:()=>stk('weapon',5).some(q=>q.bz&&q.bz.length>=4)},
 {t:'Lâmina: afinar e esticar para frente',body:'Aba Modelo: afinar a ponta transforma a caixa em lâmina; Animações → "Esticar para frente" estica por UM lado (uma ponta parada). Segue a trilha da arma.',go:{g:'props',ut:{pp:'Modelo'},sel:'Lâmina'},do:()=>{mkShape('Lâmina',{kind:'box',from:5,to:5,pos:[0,0,0],size:[.9,.08,.18],color:'#cfe0f0',attach:'weapon',dax:'x',k1:{m:{tip:.9,pw:1.2}}});addAnim('Lâmina',{type:'stretch',axis:'x',dir:'pos',amount:.5,vol:false,ease:'out'})},check:()=>{const s=shN('Lâmina');return !!s&&!isIdM(s.k1.m)&&hasAnim('Lâmina',a=>a.type==='stretch'&&a.dir==='pos')}},
 {t:'Corte em arco com rastro',body:'Forma aberta (Arco) que segue a arma e olha na direção da linha ("direção da linha"); Rastro deixa cópias e a animação Sumir desaparece no fim (intervalo 50–100%).',go:{g:'props',ut:{pp:'Olhar'},sel:'Corte'},do:()=>{mkShape('Corte',Object.assign({kind:'arc',from:5,to:5,pos:[0,0,0],size:[.9,.9,.08],color:'#d6fa66',attach:'weapon',face:'tangent',faceAxis:'x',trail:6,lag:40},flatR([0,0,0])));addAnim('Corte',{type:'fadeout',t0:.5,t1:1})},check:()=>{const s=shN('Corte');return !!s&&s.attach==='weapon'&&s.trail>0&&s.face==='tangent'}},
 {t:'Poeira nos pés do atacante',body:'Alinhar ao JOGADOR na base (pés): o anel acompanha o corpo durante a investida. Crescer desacelerando e some.',go:{g:'props',ut:{pp:'Posição'},sel:'Poeira'},do:()=>{mkShape('Poeira',Object.assign({kind:'ring',from:3,to:5,pos:[0,0,0],size:[.4,.4,.04],color:'#c9b8a0',pl:{to:'player',at:'feet'},o1:0,iv:{t0:.1,t1:.8,ease:'out'}},flatR([90,0,0])));addAnim('Poeira',{type:'grow',amount:2.5,ease:'out'})},check:()=>{const s=shN('Poeira');return !!s&&s.pl.to==='player'&&s.pl.at==='feet'}},
 {t:'Impacto: coroa em partes',body:'Olhar para "a câmera" mantém a face visível. Aba Partes: 7 fatias alternadas, afastando com início, fim e atraso entre partes; aba Tempo: tempo próprio em ms.',go:{g:'props',ut:{pp:'Partes'},sel:'Impacto'},do:()=>{const [a,b]=spanPh(6);mkShape('Impacto',Object.assign({kind:'crown',from:6,to:6,pos:[0,0,0],size:[.9,.9,.16],pr:{spikes:13,spikeLen:.7,inner:.15},color:'#ffb85e',pl:{to:'opponent',at:'center'},face:'camera',faceAxis:'z',parts:{n:7,mode:'radial',stagger:'alternate',t0:.1,t1:1,ds:.3,de:.1},k0:{r:[0,0,0]},k1:{r:[0,0,0],d:{sep:.6,sh:0,sv:0}},o1:0,tm:{a:Math.round(a),b:Math.round(b)}},{}));addAnim('Impacto',{type:'grow',amount:1.2,ease:'out'});const im=shN('Impacto');mkShape('Brasa',{kind:'octa',from:6,to:6,pos:[0,0,0],size:[.12,.12,.12],color:'#ffd84d',pl:{to:'shape:'+im.id,at:'around',r:.55,turns:2,axis:'z'},o1:0})},check:()=>{const s=shN('Impacto'),b=shN('Brasa');return !!s&&s.parts.n>1&&partsTimed(s.parts)&&s.face==='camera'&&!!b&&String(b.pl.to).indexOf('shape:')===0}},
 {t:'Faíscas: estrela, giro, cor e brilho',body:'A estrela segue a trilha Efeito, gira só no início e muda de cor com brilho (aba Forma).',go:{g:'props',ut:{pp:'Forma'},sel:'Faíscas'},do:()=>{mkShape('Faíscas',Object.assign({kind:'star',from:6,to:6,pos:[0,0,0],size:[.5,.5,.05],color:'#ffd84d',attach:'fx',color1:'#ff746c',g0:.4,g1:1.6},flatR([0,90,0])));addAnim('Faíscas',{type:'spin',axis:'z',amount:360,t0:0,t1:.6})},check:()=>{const s=shN('Faíscas');return !!s&&s.attach==='fx'&&!!s.color1&&s.g1>0}},
 {t:'Camadas: travar a lâmina pronta',body:'Gadget Camadas: renomeie, oculte, trave e reordene. A Lâmina está pronta, então fica travada para não ser movida sem querer.',go:{g:'layers'},do:()=>{const n=shN('Lâmina');T_('layer.set',{kind:'shape',id:n.id,lock:true})},check:()=>!!shN('Lâmina')&&!!shN('Lâmina').lock},
 {t:'Preset do golpe',body:'Salve o corte como preset para reaproveitar em outros golpes.',go:{g:'shapes',ut:{shp:'Presets'}},do:()=>tutPreset(shN('Corte').id,'Tutorial · Corte'),check:()=>PRS.some(p=>p.name==='Tutorial · Corte')},
 {t:'Reproduzir e conferir',body:'Espaço reproduz; use a câmera lenta no Player para ver cada fase.',go:{g:'player'},do:()=>{TUTF.played=true;T_('seek',{ms:600})},check:()=>TUTF.played},
 {t:'Exportar a referência',body:'Exportar imagem (todos os ângulos) + código num .zip, para enviar à IA.',go:{g:'export'},do:async()=>{const r=await TEL.capture({scope:'scene',fmt:'sheet',angles:'all',nf:6,size:128,zip:true,code:'all'});if(!r.ok)throw new Error(r.error)},check:()=>TUTF.exported}
]},
{id:'mid',name:'3 · Mid-range completo',type:'Mid-range',intro:'Uma conjuração: o corpo avança até uma distância média, as mãos conjuram, um círculo rúnico gira no chão do alvo e três pilares sobem em volta dele com órbitas e partes. Cobre mãos, efeito, formas planas e sólidas, esticar, órbita, presets reutilizados, tempos próprios escalonados e exportação.',steps:[
 {t:'Novo projeto: tipo Mid-range',body:'Mid-range (conjuração, CAST): o corpo também se desloca, mas para a uma distância maior do alvo.',go:{mode:'stroke'},do:()=>tutReset('mid','Tutorial · Pilares rúnicos'),check:()=>S.type==='mid'},
 {t:'Tempo das fases e distância',body:'Fases: carga 400, soltar 140, avanço 320, preparo 300, golpe 120, impacto 320, volta 360. Em Trilhas, "Parar a X%" define onde o boneco para (mid-range para mais longe que melee).',go:{g:'phases'},do:()=>{[[1,400],[2,140],[3,320],[4,300],[5,120],[6,320],[8,360]].forEach(([i,ms])=>T_('phase.ms',{index:i,ms}));S.stop.mid=.55;save();ui()},check:()=>S.ms.some((v,i)=>S.on[i]&&v!==PH[i][2])&&Math.abs(S.stop.mid-.6)>.001},
 {t:'Trilha do corpo (opcional)',body:'Sem desenho o corpo vai reto até o ponto de parada. Aqui ele avança em curva até x ≈ 0,55 (mid-range para mais longe que melee).',go:{mode:'pen',track:'body',ph:3},do:()=>mkPen('body',3,[{p:[0,.5,0]},{p:[.3,.5,.08],hi:[.2,.5,.08],ho:[.4,.5,.08]},{p:[.55,.5,0]}]),check:()=>stk('body',3).some(q=>q.bz)},
 {t:'As duas mãos conjurando',body:'Modo Caneta: as duas mãos sobem juntas no Wind-up e empurram no Release.',go:{mode:'pen',track:'handL',ph:1},do:()=>{mkPen('handR',1,[{p:[.07,.55,.06]},{p:[.04,.85,.05],hi:[.04,.75,.05],ho:[.04,.95,.05]},{p:[.08,1.05,.03]}]);mkPen('handL',1,[{p:[.07,.55,-.06]},{p:[.04,.85,-.05],hi:[.04,.75,-.05],ho:[.04,.95,-.05]},{p:[.08,1.05,-.03]}]);mkPen('handR',2,[{p:[.08,1.05,.03]},{p:[.16,.95,.02]}]);mkPen('handL',2,[{p:[.08,1.05,-.03]},{p:[.16,.95,-.02]}])},check:()=>stk('handR',1).length>0&&stk('handL',1).length>0&&stk('handR',2).length>0},
 {t:'Mão estendida e rastro de luz (Efeito)',body:'No Prelude o corpo já chegou (x≈0,55): a mão fica estendida e a trilha Efeito sobe em espiral até o alvo. Uma esfera SEGUE a trilha Efeito e deixa rastro.',go:{mode:'pen',track:'fx',ph:4},do:()=>{mkPen('handR',4,[{p:[.56,.95,.05]},{p:[.62,1,.03]}]);mkPen('fx',4,[{p:[.85,.1,0]},{p:[.9,.7,.1],hi:[.86,.4,.1],ho:[.94,1,.1]},{p:[.96,1.25,0],hi:[.93,1.1,.05]}]);mkShape('Rastro de luz',{kind:'sphere',from:4,to:4,pos:[0,0,0],size:[.14,.14,.14],color:'#d6fa66',attach:'fx',trail:5,lag:50,g1:1})},check:()=>stk('handR',4).length>0&&stk('fx',4).some(q=>q.bz)&&!!shN('Rastro de luz')&&shN('Rastro de luz').attach==='fx'&&shN('Rastro de luz').trail>0},
 {t:'Ajustar os pontos da espiral',body:'Modo Pontos: mexa a âncora do meio. Segure Ctrl para os vizinhos acompanharem.',go:{mode:'path',pick:['fx',4]},do:()=>{const q=stk('fx',4)[0];if(q.bz.length<4)T_('stroke.op',{id:q.id,op:'insert',after:0});const n=nz(q.bz[1].p);T_('stroke.op',{id:q.id,op:'point',index:1,pos:[n[0],n[1]+.03,n[2]],norm:true})},check:()=>stk('fx',4).some(q=>q.bz&&q.bz.length>=4)},
 {t:'Círculo rúnico no chão do alvo',body:'Forma plana (anel) alinhada ao OPONENTE na base. Gira o tempo todo (por % da forma) e brilha mais no fim. Tempo próprio: começa no Prelude e vai até o Impact.',go:{g:'props',ut:{pp:'Tempo'},sel:'Círculo rúnico'},do:()=>{const [a]=spanPh(4),[,b]=spanPh(6);mkShape('Círculo rúnico',Object.assign({kind:'ring',from:4,to:6,pos:[0,0,0],size:[1.4,1.4,.05],color:'#b79cff',pl:{to:'opponent',at:'feet'},g0:.3,g1:1.2,tm:{a:Math.round(a),b:Math.round(b)}},flatR([90,0,0])));addAnim('Círculo rúnico',{type:'spin',axis:'z',amount:180})},check:()=>{const s=shN('Círculo rúnico');return !!s&&s.pl.at==='feet'&&!!s.tm&&s.g1>0}},
 {t:'Estrela rúnica contra-girando',body:'Mesma base, tamanho menor, gira ao contrário (intensidade negativa), com rotação própria (aba Forma → Rotação).',go:{g:'props',ut:{pp:'Forma'},sel:'Estrela rúnica'},do:()=>{const [a]=spanPh(4),[,b]=spanPh(6);mkShape('Estrela rúnica',Object.assign({kind:'star',from:4,to:6,pos:[0,0,0],size:[1,1,.05],color:'#f0c57e',pl:{to:'opponent',at:'feet'},tm:{a:Math.round(a+100),b:Math.round(b)}},flatR([90,25,0])));addAnim('Estrela rúnica',{type:'spin',axis:'z',amount:-270})},check:()=>hasAnim('Estrela rúnica',a=>a.type==='spin'&&a.amount<0)},
 {t:'Pilar: afinação e esticar para cima',body:'Cilindro curto no chão em volta do alvo (alinhamento "ao redor", raio 0,7). Afinar a ponta (aba Modelo, eixo Y) e "Esticar para cima" (uma ponta fica no chão).',go:{g:'props',ut:{pp:'Modelo'},sel:'Pilar 1'},do:()=>{const [a]=spanPh(5),[,b]=spanPh(6);mkShape('Pilar 1',{kind:'cylinder',from:5,to:6,pos:[0,-.65,0],size:[.28,.3,.28],color:'#63d9ec',dax:'y',k1:{m:{tip:.7,pw:1.4}},pl:{to:'opponent',at:'around',r:.7,turns:0,ang:0},tm:{a:Math.round(a),b:Math.round(b)},o1:.7});addAnim('Pilar 1',{type:'stretch',axis:'y',dir:'pos',amount:4,vol:false,ease:'out'})},check:()=>{const s=shN('Pilar 1');return !!s&&!isIdM(s.k1.m)&&hasAnim('Pilar 1',a=>a.type==='stretch'&&a.dir==='pos')}},
 {t:'Reaproveitar com presets (3 pilares)',body:'Salve o Pilar 1 como preset e crie mais dois a partir dele ("Criar na cena"); mude o ângulo da órbita (120° e 240°) e escalone o tempo próprio.',go:{g:'shapes',ut:{shp:'Presets'}},do:()=>{tutPreset(shN('Pilar 1').id,'Tutorial · Pilar');const p=PRS.find(x=>x.name==='Tutorial · Pilar'),base=shN('Pilar 1');[[2,120,60],[3,240,120]].forEach(([n,ang,dl])=>{if(shN('Pilar '+n))return;const r=T_('preset.apply',{pid:p.pid});T_('shape.set',{id:r.id,name:'Pilar '+n,pl:{to:'opponent',at:'around',r:.7,turns:0,ang},tm:{a:base.tm.a+dl,b:base.tm.b+dl}})})},check:()=>!!shN('Pilar 2')&&!!shN('Pilar 3')&&shN('Pilar 3').pl.ang===240},
 {t:'Pilares que se quebram (partes com tempo)',body:'Aba Partes: fatias horizontais (eixo Y), separando só no fim (início 60%) com atraso entre as partes.',go:{g:'props',ut:{pp:'Partes'},sel:'Pilar 1'},do:()=>['Pilar 1','Pilar 2','Pilar 3'].forEach(n=>setSh(n,{parts:{n:4,mode:'y',stagger:'progressive',t0:.6,t1:1,ds:.4,de:.2},k1:{d:{sep:.5,sh:0,sv:0}}})),check:()=>['Pilar 1','Pilar 2','Pilar 3'].every(n=>shN(n)&&shN(n).parts.n===4&&partsTimed(shN(n).parts))},
 {t:'Orbe e fagulha: órbitas em cadeia',body:'O orbe gira em volta do oponente (2 voltas); a fagulha orbita o ORBE. Alinhar a outra forma permite cadeias de movimento.',go:{g:'props',ut:{pp:'Posição'},sel:'Orbe'},do:()=>{const [a]=spanPh(4),[,b]=spanPh(6);mkShape('Orbe',{kind:'sphere',from:4,to:6,pos:[0,0,0],size:[.22,.22,.22],color:'#ffd84d',g1:1.2,pl:{to:'opponent',at:'around',r:.5,turns:2,axis:'y'},tm:{a:Math.round(a),b:Math.round(b)}});const o=shN('Orbe');mkShape('Fagulha',{kind:'octa',from:4,to:6,pos:[0,0,0],size:[.08,.08,.08],color:'#ffffff',pl:{to:'shape:'+o.id,at:'around',r:.18,turns:4,axis:'x'},tm:{a:Math.round(a),b:Math.round(b)}})},check:()=>{const s=shN('Fagulha');return !!shN('Orbe')&&!!s&&String(s.pl.to).indexOf('shape:')===0}},
 {t:'Feixe de luz de cima',body:'Alinhamento "acima" do oponente; animação Surgir com intervalo, cor que muda ao longo do tempo e curva do movimento (aba Tempo). O Halo é uma coroa que olha para a câmera.',go:{g:'props',ut:{pp:'Posição'},sel:'Feixe'},do:()=>{mkShape('Feixe',{kind:'cylinder',from:5,to:6,pos:[0,0,0],size:[.3,2.4,.3],color:'#ffffff',color1:'#b79cff',g1:1.5,o0:.2,pl:{to:'opponent',at:'above',gap:.1},iv:{t0:.2,t1:1,ease:'inout'}});addAnim('Feixe',{type:'fadein',t0:0,t1:.5});mkShape('Halo',{kind:'crown',from:5,to:6,pos:[0,0,0],size:[.9,.9,.1],pr:{spikes:11,spikeLen:.5,inner:.3},color:'#f0c57e',pl:{to:'opponent',at:'above',gap:.3},face:'camera',faceAxis:'z',g1:1,k0:{r:[0,0,0]},k1:{r:[0,0,0]}})},check:()=>{const s=shN('Feixe');return !!s&&s.pl.at==='above'&&hasAnim('Feixe',a=>a.type==='fadein')&&!!shN('Halo')&&shN('Halo').face==='camera'}},
 {t:'Camadas e isolar',body:'Gadget Camadas: oculte a Estrela rúnica para ver os pilares; "Isolar" mostra só a camada selecionada; travar evita mexer sem querer.',go:{g:'layers'},do:()=>{const s=shN('Estrela rúnica');T_('layer.set',{kind:'shape',id:s.id,lock:true})},check:()=>!!shN('Estrela rúnica')&&!!shN('Estrela rúnica').lock},
 {t:'Reproduzir e conferir',body:'Espaço reproduz; no Player, câmera lenta para ver os pilares subindo em sequência.',go:{g:'player'},do:()=>{TUTF.played=true;T_('seek',{ms:900})},check:()=>TUTF.played},
 {t:'Exportar a referência',body:'Exportar imagem de todos os ângulos + código (.zip).',go:{g:'export'},do:async()=>{const r=await TEL.capture({scope:'scene',fmt:'sheet',angles:'all',nf:6,size:128,zip:true,code:'all'});if(!r.ok)throw new Error(r.error)},check:()=>TUTF.exported}
