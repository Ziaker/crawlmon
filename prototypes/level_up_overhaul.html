<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Up Overhaul</title>
<style>
/* D-1185 — protótipo do overhaul do pós-combate (XP, level up, pontos, Move novo).
   Rodada 3: visual da Status Screen do jogo (D-1178): flat, sem borda, sombra dura,
   cada bloco com rotação própria, ícones reais de elemento/tipo/alcance.
   Regra técnica (D-433 §5): paralelogramo só como FUNDO; o texto nunca é inclinado
   sozinho. Girar o bloco inteiro = Control.rotation no Godot. Palco fixo 1280×720. */
:root{
  --ink:#080e18; --ink2:#10263a; --navy:#0a1a27; --navy2:#0e2435;
  --paper:#f4eee1; --text-dark:#111b29;
  --aqua:#63d9ec; --lime:#d6fa66; --gold:#f0c57e; --coral:#ff746c; --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05080e;color:#eceada;font-family:Arial,"Segoe UI",sans-serif;overflow:hidden}
#bar{height:44px;display:flex;gap:8px;align-items:center;padding:0 16px;background:#0b111b;border-bottom:1px solid #1d2a3c;font-size:13px;overflow-x:auto}
#bar b{color:var(--gold);margin-right:6px;white-space:nowrap}
#bar button{background:#17283b;color:#dfe7f1;border:0;padding:6px 10px;font:700 12px Arial;cursor:pointer;white-space:nowrap}
#bar button.on{background:var(--aqua);color:var(--ink)}
#bar .sep{width:1px;height:22px;background:#2a3a50;margin:0 4px;flex:none}
#bar .hint{margin-left:auto;color:#8695a8;white-space:nowrap}
#wrap{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:hidden}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;overflow:hidden;
  background:radial-gradient(ellipse at 55% 35%,#17364b 0%,#0b1d2b 50%,#050c14 100%)}
#stage:before{content:"";position:absolute;left:0;top:0;width:520px;height:4px;background:var(--lime);z-index:5}
#stage:after{content:"";position:absolute;left:520px;top:0;width:360px;height:4px;background:var(--coral);z-index:5}
.bgcity{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 120px,rgba(40,80,110,.08) 120px 170px);opacity:.7}

/* Base: paralelogramo só como fundo; .sh = sombra dura deslocada. */
.para{position:absolute;inset:0;clip-path:polygon(var(--k,14px) 0,100% 0,calc(100% - var(--k,14px)) 100%,0 100%)}
.sh{transform:translate(7px,7px);background:var(--shadow)}
.box{position:absolute;rotate:var(--r,0deg)}
.ico{display:inline-block;background:currentColor;-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
.sec{font:800 14px Arial;letter-spacing:.5px;color:var(--lime);padding-bottom:4px;border-bottom:2px solid #3f5a2a}

/* Título no estilo TEAM /STATS */
#title{left:52px;top:30px}
#title .t,#mvHead .t{font:62px Impact,"Arial Black",sans-serif;color:var(--paper);letter-spacing:1px;line-height:64px;white-space:nowrap}
#title .t i,#mvHead .t i{font-style:normal;color:var(--coral)} #title .t em{font-style:normal;color:var(--lime)}
#mvHead{left:52px;top:30px} #mvHead .t em{font-style:normal;color:var(--aqua)}

/* Cards de membro */
.card{position:absolute;left:52px;width:700px;height:130px;rotate:var(--r,0deg)}
.card .para{--k:20px}
.card .bg{background:var(--paper)} .card.ally .bg{background:#e6e3d2}
.card.ko{filter:grayscale(1) brightness(.55)}
.card .stripe{position:absolute;left:-6px;top:0;bottom:0;width:10px;background:var(--lime);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.card.ally .stripe{background:var(--aqua)}
.portrait{position:absolute;left:30px;top:15px;width:96px;height:100px;overflow:hidden;background:#5c3c1e;outline:3px solid var(--ink2)}
.portrait i,.big-portrait i{position:absolute;inset:0;background-repeat:no-repeat}
.name{position:absolute;left:146px;top:12px;font:32px Impact,"Arial Black";letter-spacing:.5px;color:var(--text-dark)}
.elb{position:absolute;top:18px;width:34px;height:24px;display:flex;align-items:center;justify-content:center}
.elb .para{--k:6px}
.elb .ico{position:relative;width:16px;height:16px}
.lv{position:absolute;right:52px;top:16px;font:800 18px Arial;color:#3a4250}
.lv b{font:30px Impact;color:var(--text-dark);margin-left:4px}
.lv .arrow,.lvl .arrow{color:var(--coral);font:24px Impact;margin:0 4px}
.gain{position:absolute;left:146px;top:58px;font:800 17px Arial;color:#2f6b12}
.kotag{position:absolute;left:146px;top:58px;font:800 17px Arial;color:#444}
.xpbar{position:absolute;left:146px;right:52px;top:84px;height:20px}
.xpbar .para{--k:8px}
.xpbar .track{background:#d3cfbd}
.xpbar .fill{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden}
.xpbar .fill .para{background:var(--gold)}
.xpbar .num{position:absolute;right:10px;top:-24px;font:800 14px Arial;color:#3a4250}
.stamp{position:absolute;right:200px;top:-24px;width:186px;height:42px;rotate:-5deg;transform:scale(0);transition:transform .32s cubic-bezier(.2,1.6,.4,1)}
.stamp .para{background:var(--coral);--k:12px}
.stamp .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:26px Impact;color:#fff;letter-spacing:1px}
.stamp.on{transform:scale(1)}

/* Fila */
#queue{left:806px;top:150px;width:420px;--r:1.2deg}
#queue .sec{margin-bottom:12px}
.qi{position:relative;height:44px;margin-bottom:8px;rotate:var(--r,0deg)}
.qi .para{--k:12px} .qi .bg{background:var(--navy2)}
.qi.cur .bg{background:var(--aqua)}
.qi.done{opacity:.4}
.qi .t{position:absolute;left:22px;right:16px;top:0;bottom:0;display:flex;align-items:center;gap:10px;font:800 15px Arial;color:#dbe4ee;white-space:nowrap}
.qi.cur .t{color:var(--ink)}
.qi .k{font:13px Impact;letter-spacing:1px;padding:3px 8px;background:var(--ink);color:var(--gold)}

/* Prompt e trilha */
#prompt{right:52px;bottom:28px;height:46px;width:290px;--r:-2deg}
#prompt .para{--k:14px} #prompt .bg{background:var(--ink)}
#prompt .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font:800 17px Arial;color:#fff}
.key{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--paper);color:var(--ink);font:800 16px Arial}
#prompt.lock .t{color:#6f7f93} #prompt.lock .key{background:#3b4656}
#prompt{transition:transform .28s cubic-bezier(.2,1.6,.4,1)} #prompt.foc .bg{background:var(--aqua)} #prompt.foc .t{color:var(--ink)}
#insp .close.alt{right:340px} #insp .close.alt .bg{background:var(--coral)} #insp .close.alt .t{color:#fff} #insp .close.alt .key{background:#fff;color:var(--ink)}
#strip{right:52px;top:22px;display:flex;gap:6px}
#strip span{font:800 12px Arial;letter-spacing:.5px;padding:5px 12px;background:var(--navy2);color:#6f7f93;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
#strip span.c{background:var(--aqua);color:var(--ink)} #strip span.d{color:#3d4a5c}

/* Level up */
#lvCard{left:52px;top:118px;width:500px;height:500px;--r:-2.5deg}
#lvCard .para{--k:26px}
.big-portrait{position:absolute;left:44px;top:34px;width:196px;height:216px;overflow:hidden;background:#5c3c1e;outline:4px solid var(--ink2);rotate:2deg}
#lvCard .nm{position:absolute;left:262px;top:38px;font:46px Impact;color:var(--text-dark)}
#lvCard .lvl{position:absolute;left:262px;top:98px;font:800 20px Arial;color:#3a4250}
#lvCard .lvl b{font:44px Impact;color:var(--text-dark)}
#lvCard .sub{position:absolute;left:262px;top:166px;font:800 15px Arial;line-height:24px;color:#3a4250}
.statgain{position:absolute;left:44px;top:282px;right:44px}
.sg{position:relative;height:44px;margin-bottom:12px;rotate:var(--r,0deg)}
.sg .para{--k:12px;background:var(--ink2)}
.sg .t{position:absolute;left:26px;right:26px;top:0;bottom:0;display:flex;align-items:center;justify-content:space-between;font:800 17px Arial;color:#dbe4ee}
.sg .t em{font-style:normal;color:var(--lime);margin-left:8px}
.sg .t .lab{font:20px Impact;letter-spacing:1px;color:var(--sc,var(--aqua))}
#lvCard .stamp{right:24px;top:-22px}

#attr{left:604px;top:128px;width:620px;height:482px;--r:1.5deg}
#attr .para{--k:26px} #attr .bg{background:var(--navy)}
#attr h3{position:absolute;left:50px;top:24px;font:30px Impact;letter-spacing:1px;color:var(--paper);font-weight:normal}
#attr h3 i{font-style:normal;color:var(--coral)}
#attr .pts{position:absolute;right:50px;top:30px;font:800 18px Arial;color:var(--lime)}
.row{position:absolute;left:44px;right:44px;height:46px;rotate:var(--r,0deg)}
.row .para{background:var(--navy2);--k:12px}
.row.sel .para{background:#21486a}
.row.auto .para{background:#3a2f12}
.row .t{position:absolute;left:28px;right:24px;top:0;bottom:0;display:flex;align-items:center;font:800 18px Arial;color:#e6edf5}
.row .st{width:66px;font:24px Impact;letter-spacing:1px;color:var(--sc,var(--aqua))}
.row .tag,.sg .tag{position:absolute;left:0;top:0;bottom:0;width:22px;background:var(--sc);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.row .ds{flex:1;font:700 14px Arial;color:#8fa3b8}
.row .vl{width:130px;display:flex;align-items:center;justify-content:flex-end;gap:10px}
.row .vl b{font-size:24px;min-width:34px;text-align:right}
.row .plus{color:var(--lime);font-size:18px;min-width:34px}
.row .btn{font:800 16px Arial;color:#4f6077}
.row.sel .btn{color:#fff}
.row .why{font:700 13px Arial;color:var(--gold)}
.cbtn{position:absolute;left:44px;right:44px;bottom:24px;height:54px;rotate:-1deg}
#attr .cbtn .para{--k:16px} #attr .cbtn .bg{background:#253446}
#attr .cbtn.ready .bg{background:var(--lime)}
#attr .cbtn.sel.ready .bg{background:#efff9e}
#attr .cbtn.ready{animation:ready-pulse 1.1s ease-in-out infinite}
@keyframes ready-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.cbtn .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:24px Impact;letter-spacing:1px;color:#6f7f93}
.cbtn.ready .t{color:var(--ink)}

/* Ficha grande (ficha expandida da Status Screen): fundo do elemento + glifo em marca d'água */
.sheet{position:absolute;width:440px;height:250px;rotate:var(--r,0deg)}
.sheet .para{--k:18px}
.sheet .wm{position:absolute;right:26px;top:34px;width:170px;height:170px}
.sheet .mn{position:absolute;left:34px;top:22px;font:42px Impact;letter-spacing:.5px;white-space:nowrap}
.sheet .badges{position:absolute;left:34px;top:80px;display:flex;gap:8px}
.bdg{position:relative;width:34px;height:28px;display:flex;align-items:center;justify-content:center}
.bdg .para{--k:6px}
.bdg .ico{position:relative;width:18px;height:18px}
.sheet .desc{position:absolute;left:34px;right:200px;top:124px;font:800 15px Arial;line-height:21px}
.sheet .costs{position:absolute;left:34px;bottom:24px;display:flex;gap:8px}
.pill{position:relative;height:28px;padding:0 14px;display:flex;align-items:center;font:800 14px Arial;color:#fff;white-space:nowrap}
.pill .para{--k:7px}
.pill span{position:relative}

/* Card pequeno (faixa de skills da Status Screen): tile do elemento + corpo escuro + glifo em marca d'água */
.mcard{position:absolute;width:330px;height:100px;rotate:var(--r,0deg);transition:transform .28s cubic-bezier(.2,1.6,.4,1)}
.mcard .shd{position:absolute;inset:0;transform:translate(6px,6px);background:var(--shadow);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.mcard .body{position:absolute;inset:0;background:var(--navy2);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.mcard .tile{position:absolute;left:0;top:0;bottom:0;width:78px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);display:flex;align-items:center;justify-content:center}
.mcard .tile .ico{width:34px;height:34px}
.mcard .wm{position:absolute;right:18px;top:10px;width:80px;height:80px;opacity:.13;color:#fff}
.mcard .mn{position:absolute;left:92px;top:12px;right:16px;font:24px Impact;letter-spacing:.5px;color:#fff;white-space:nowrap}
.mcard .bad{position:absolute;left:92px;top:46px;display:flex;gap:6px}
.mcard .bad .bdg{width:28px;height:22px} .mcard .bad .ico{width:14px;height:14px}
.mcard .cost{position:absolute;left:92px;bottom:12px;right:22px;display:flex;align-items:center;justify-content:space-between;font:800 14px Arial;color:#cfe3f5}
.atb{display:flex;gap:3px}
.atb s{display:block;width:15px;height:12px;background:#244055;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.atb s.on{background:#22a8d6}
.mcard[data-id],.sheet[data-id]{cursor:pointer}
.mcard.empty .body{background:rgba(14,36,53,.4)}
.mcard.empty .mn{color:#4d6278;left:28px;top:34px;font:20px Impact}
/* Rodada 9: seleção (lift com mola + barra coral que se estende + seta pulsando) */
.sheet{transition:transform .28s cubic-bezier(.2,1.6,.4,1)}
.foc{transform:translateY(-8px) scale(1.04);z-index:4}
.sheet.foc{transform:translateY(-6px) scale(1.03)}
.mcard.foc .body{background:#21486a}
.foc:after{content:"";position:absolute;left:6px;right:6px;bottom:-13px;height:6px;background:var(--coral);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);transform-origin:left;animation:bar .28s cubic-bezier(.2,1,.3,1)}
.foc:before{content:"";position:absolute;left:-28px;top:50%;width:16px;height:22px;margin-top:-11px;background:var(--coral);clip-path:polygon(0 0,100% 50%,0 100%);animation:chev .7s ease-in-out infinite;z-index:5}
@keyframes bar{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes chev{0%,100%{translate:0 0}50%{translate:6px 0}}
/* Rodada 10: chegada épica do Move novo (sem piscar a tela: nada de flash/estrobo) */
.mcard.arrive{opacity:0}
.mcard.arriving{opacity:1;z-index:8;animation:slam .62s cubic-bezier(.55,0,.35,1) both}
@keyframes slam{0%{transform:translate(-120px,-300px) scale(2.4) rotate(-14deg);opacity:0}
  55%{transform:translate(0,8px) scale(.94) rotate(1deg);opacity:1}
  72%{transform:translate(0,-6px) scale(1.06)} 86%{transform:translate(0,2px) scale(.99)} 100%{transform:none;opacity:1}}
.mcard.arrive .newtag,.mcard.arriving .newtag{opacity:0;animation:none}
.mcard.slammed .newtag{opacity:1;animation:tagslam .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes tagslam{0%{transform:scale(3.2) rotate(40deg);opacity:0}60%{transform:scale(.9) rotate(-6deg);opacity:1}100%{transform:none;opacity:1}}
#spot{position:absolute;inset:0;background:rgba(2,5,10,.62);opacity:0;pointer-events:none;z-index:7;transition:opacity .25s}
#spot.on{opacity:1}
.fx{position:absolute;pointer-events:none;z-index:9}
.fx.ring{width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:6px solid var(--c);animation:ring .7s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes ring{0%{transform:scale(.3);opacity:1}100%{transform:scale(11);opacity:0;border-width:1px}}
.fx.ring.r2{animation-delay:.08s;border-color:#fff;opacity:0;animation-fill-mode:both}
.fx.ray{height:8px;margin-top:-4px;transform-origin:0 50%;background:linear-gradient(90deg,var(--c),transparent);clip-path:polygon(0 30%,100% 0,100% 100%,0 70%);animation:ray .55s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes ray{0%{transform:rotate(var(--a)) translateX(30px) scaleX(.1);opacity:1}100%{transform:rotate(var(--a)) translateX(160px) scaleX(1);opacity:0}}
.fx.spark{width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--c);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:spark .8s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(220deg);opacity:0}}
.fx.ghost{width:300px;height:300px;margin:-150px 0 0 -150px;background:var(--c);-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat;animation:ghost .8s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes ghost{0%{transform:scale(.4) rotate(-20deg);opacity:.55}100%{transform:scale(2.1) rotate(10deg);opacity:0}}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-7px 4px}40%{translate:6px -3px}60%{translate:-4px 2px}80%{translate:2px -1px}}
.shake{animation:shake .32s linear}
#slotsHead{left:540px;top:126px;width:690px}
#slotsHead span{color:#8a99ad;font:700 14px Arial;margin-left:10px;letter-spacing:0}
.skip{position:absolute;left:52px;top:430px;width:440px;height:56px;rotate:1.5deg}
.skip .para{--k:16px} .skip .bg{background:#3a1715}
.skip{transition:transform .28s cubic-bezier(.2,1.6,.4,1)} .skip.foc .bg{background:var(--coral)}
.skip .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:22px Impact;letter-spacing:1px;color:#ffb3aa}
.skip.foc .t{color:#fff}
#mvMsg{left:52px;top:510px;width:440px;font:800 18px Arial;line-height:26px;color:#e6edf5}
#mvMsg b{color:var(--lime)}

/* Confirmação */
#confirm{position:absolute;inset:0;background:rgba(2,4,8,.72);display:none;z-index:10}
#confirm.on{display:block}
#confirm .box{left:330px;top:250px;width:620px;height:200px;--r:-2deg}
#confirm .para{--k:26px} #confirm .bg{background:var(--paper)}
#confirm .q{position:absolute;left:50px;right:50px;top:34px;font:800 22px Arial;color:var(--text-dark);line-height:30px;text-align:center}
#confirm .q b{color:#c23b2a}
#confirm .a{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center;gap:40px;font:800 17px Arial;color:var(--text-dark)}
#confirm .a span{display:flex;gap:8px;align-items:center}
#confirm .key{background:var(--ink);color:#fff}

#endMsg{left:0;right:0;top:296px;text-align:center;font:62px Impact;color:var(--paper);letter-spacing:1px}
#endMsg i{font-style:normal;color:var(--coral)}
#endSub{left:0;right:0;top:384px;text-align:center;font:800 18px Arial;color:#8a99ad}
.note{position:absolute;left:52px;bottom:30px;font:700 13px Arial;color:#6f7f93;max-width:640px;line-height:18px}
.hide{display:none!important}


/* Rodada 6: inspeção do Move (visão expandida D-420 §4) */
#insp{position:absolute;inset:0;background:rgba(3,7,12,.9);z-index:20}
#insp .head{left:72px;top:54px;width:1136px;height:156px;--r:-1.2deg}
#insp .head > .para{--k:24px}
#insp .head .wm{position:absolute;right:60px;top:-6px;width:170px;height:170px}
#insp .kick{position:absolute;left:46px;top:16px;font:800 14px Arial;letter-spacing:1px}
#insp .head .mn{position:absolute;left:46px;top:36px;font:58px Impact;letter-spacing:.5px;white-space:nowrap}
#insp .head .badges{position:absolute;left:46px;top:104px;display:flex;gap:8px}
#insp .head .costs{position:absolute;right:220px;top:26px;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
#insp .head .costs .pill{height:32px;font-size:16px;padding:0 16px}
#insp .head .lines{position:absolute;left:470px;right:400px;top:24px;bottom:18px;display:flex;flex-direction:column;justify-content:center;gap:6px}
#insp .head .lines div{position:relative;padding:5px 14px 6px;font:800 17px/21px Arial;background:rgba(8,14,24,.82);color:#f1f5f9;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
#insp .head .mn{max-width:420px}
#insp .blk{top:236px;height:396px}
#insp .blk > .para{--k:20px} #insp .blk > .bg{background:var(--navy)}
#insp .b1{left:72px;width:620px;--r:1deg} #insp .b2{left:716px;width:492px;--r:-1deg}
#insp .b2 > .bg{background:#1a1226}
#insp .side{position:absolute;left:40px;top:-16px;padding:3px 14px;font:20px Impact;letter-spacing:1px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);z-index:2}
#insp .b1 .side{background:var(--lime);color:var(--ink)} #insp .b2 .side{background:#f472b6;color:var(--ink)}
#insp .b2 .s h4{color:#f9a8d4}
#insp .vals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 8px;margin-bottom:14px}

/* Rodada 8: destaque do Move novo (borda brilhante + NEW! no canto) */
.newtag{position:absolute;right:-14px;top:-18px;pointer-events:none;padding:4px 14px 3px;font:22px Impact;letter-spacing:1px;color:var(--ink);background:var(--lime);rotate:9deg;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);z-index:3;animation:newpop .5s cubic-bezier(.2,1.6,.4,1) backwards .3s}

.bdg.pend .para{background:#3b4656} .bdg.pend b{position:relative;font:900 15px Arial;color:#c9d3df}

/* Rodada 13: mecânicas em lista + pop-up dos ícones */
#insp ul{list-style:none;margin:0 0 4px} #insp li{position:relative;padding-left:16px;font:700 15px/20px Arial;color:#d5e0ea;margin-bottom:3px}
#insp li:before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;background:var(--lime);clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
#insp li.plan:before{background:#94a3b8} #insp li.plan{color:#94a3b8;font-style:italic}
.bdg,.elb,.mcard .tile{cursor:help}
#tip{position:absolute;z-index:40;width:300px;padding:14px 38px 14px 18px;background:var(--paper);color:var(--text-dark);font:800 14px/19px Arial;rotate:-1.5deg;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);filter:drop-shadow(5px 5px 0 rgba(0,0,0,.6));animation:tipin .22s cubic-bezier(.2,1.6,.4,1)}
#tip b{display:block;font:20px Impact;letter-spacing:.5px;margin-bottom:3px;color:var(--ink)}
#tip .x{position:absolute;right:14px;top:10px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;font:800 13px Arial;cursor:pointer}
#tip .bar{position:absolute;left:12px;right:12px;bottom:5px;height:3px;background:var(--coral);transform-origin:left;animation:tipbar 5s linear forwards}
@keyframes tipin{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}

/* Entradas (rodada 2): só posição/escala/opacidade = Tween no Godot. A rotação fica na

@keyframes in-slide{0%{transform:translateX(-90px);opacity:0}70%{transform:translateX(8px);opacity:1}100%{transform:none;opacity:1}}
@keyframes in-pop{0%{transform:scale(.55);opacity:0}65%{transform:scale(1.06);opacity:1}100%{transform:none;opacity:1}}
@keyframes in-drop{0%{transform:translateY(-70px);opacity:0}60%{transform:translateY(6px);opacity:1}80%{transform:translateY(-3px)}100%{transform:none;opacity:1}}
.enter{animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.9,.3,1);animation-fill-mode:backwards}
.enter.slide{animation-name:in-slide} .enter.pop{animation-name:in-pop} .enter.drop{animation-name:in-drop}
/* Rodada 5: letra a letra (draw_char + Tween no Godot) */
.ch{display:inline-block;animation:ch-in .34s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes ch-in{0%{transform:translateY(-.5em) scale(1.7);opacity:0}100%{transform:none;opacity:1}}

function pancham(xp, alive, moves){ return {id:"pancham",name:"PANCHAM",hero:false,lv:2,xp,alive,
  stats:{STR:6,MAG:1,VIT:4,WIS:2,AGI:3,LUK:2},moves,hp:[53,9],mp:[18,2],nature:"Brave",prefer:"STR"}; }
const ABRA7 = ["confusion","psybeam","shockwave","teleport","media","sukunda","megido"];
const PAN6 = ["machpunch","karate","brick","taunt","tarukaja","hassou"];
const SCEN = {
  A:{xp:60, party:()=>[abra(20,ABRA7),pancham(40,true,PAN6)], learn:{}},
  B:{xp:60, party:()=>[abra(180,ABRA7),pancham(40,true,PAN6)], learn:{}},
  C:{xp:60, party:()=>[abra(180,ABRA7),pancham(40,true,PAN6)], learn:{abra:{3:"heal"}}},
  D:{xp:60, party:()=>[abra(180,[...ABRA7,"heal"]),pancham(170,true,PAN6)], learn:{abra:{3:"ebeam"},pancham:{3:"warcry"}}},
  E:{xp:60, party:()=>[abra(180,ABRA7),pancham(40,false,PAN6)], learn:{}}
};
// Ângulos tortos: cada bloco tem o seu (graus).
const TILT = {cards:[-1.6,1.2], queue:[-1,1.4,-0.6,1,-1.4,0.8], rows:[-0.7,0.6,-0.5,0.8,-0.6,0.5], slots:[-1.6,1.3,1.1,-1.4,-0.9,1.6,1.4,-1.1], sg:[-1.2,1]};

// ---- Estado ----
const S = document.getElementById("stage");
let sc, party, steps, si, ui = {}, ANIM = "slide";

function fit(){ const w = innerWidth, h = innerHeight-44, k = Math.min(w/1280, h/720, 1.25);
  S.style.transform = `translate(-50%,-50%) scale(${k})`; }
addEventListener("resize", fit);

function start(key){
  document.querySelectorAll("#bar button[data-s]").forEach(b=>b.classList.toggle("on", b.dataset.s===key));
  sc = SCEN[key]; party = sc.party(); steps = [{k:"xp"}];
  for (const m of party){
    m.from = {lv:m.lv, xp:m.xp}; m.gain = m.alive ? sc.xp : 0; m.lvGain = 0; m.pts = 0;
    let xp = m.xp + m.gain;
    while (m.alive && xp >= REQ(m.lv)) { xp -= REQ(m.lv); m.lv++; m.lvGain++; m.pts += 1; }
    m.xp = xp;
  }
  for (const m of party) if (m.lvGain) steps.push({k:"lv", m});
  for (const m of party) if (m.lvGain)
    for (let l = m.from.lv+1; l <= m.lv; l++){ const mv = (sc.learn[m.id]||{})[l]; if (mv) steps.push({k:"mv", m, mv}); }
  steps.push({k:"end"});
  si = 0; render();
}

// ---- Peças ----
function portrait(id, w, h){
  const a = ART[id], [x0,y0,x1,y1] = a.crop, k = Math.max(w/(x1-x0), h/(y1-y0));
  return `<i style="background-image:url(${a.src});background-size:${a.w*k}px ${a.h*k}px;background-position:${-x0*k + (w-(x1-x0)*k)/2}px ${-y0*k}px"></i>`;
}
function elBadge(el, left){ const e = EL[el];
  return `<div class="elb" data-tip="el:${el}" style="left:${left}px"><div class="para" style="background:${e.c}"></div><span class="ico" style="${ICON(e.i)};color:${e.dark?"#0a1520":"#fff"}"></span></div>`; }
function badges(m){
  let h = "";
  // D-1190: ícone de Status (opção A, ±); cor do badge branca, escolhida pelo criador.
  if (m.ty==="STATUS") return `<div class="bdg" data-tip="status"><div class="para" style="background:#ffffff"></div><span class="ico" style="${ICON("move_types/status")};color:#080e18"></span></div>`;
  if (m.ty!=="STATUS"){ const t = TYPE[m.ty]; h += `<div class="bdg" data-tip="${m.ty}"><div class="para" style="background:${t.c}"></div><span class="ico" style="${ICON(t.i)};color:#fff"></span></div>`; }
  if (m.rg) h += `<div class="bdg" data-tip="rg:${m.rg}"><div class="para" style="background:#fff"></div><span class="ico" style="${ICON("range/"+m.rg)};color:#080e18"></span></div>`;
  return h;
}
// D-1188: o chip POWER tem a cor do stat que o Move usa: mágico = cor do MAG; físico = o dourado de sempre.
function powerPill(m){
  if (!m.pw) return "";
  const c = m.ty==="MAG" ? STAT_C.MAG : "#f59e0b";
  return `<div class="pill"><div class="para" style="background:${c}"></div><span style="color:#111">POWER ×${m.pw}</span></div>`;
}
function sheet(id, attrs){
  const m = MV[id], e = EL[m.el], fg = e.dark ? "#080e18" : "#fff", sub = e.dark ? "rgba(8,14,24,.85)" : "rgba(255,255,255,.92)";
  const nw = ui.mv===id;
  return `<div class="sheet" data-id="${id}" data-f="sheet" ${attrs}><div class="para sh"></div><div class="para" style="background:${e.c}"></div>${nw?`<div class="newtag">NEW!</div>`:""}
    <span class="ico wm" style="${ICON(e.i)};color:${e.dark?"#000":"#fff"};opacity:${e.dark?.16:.24}"></span>
    <div class="mn" style="color:${fg}">${m.n.toUpperCase()}</div>
    <div class="badges">${badges(m)}</div>
    <div class="desc" style="color:${sub}">${m.d}</div>
    <div class="costs">
      <div class="pill"><div class="para" style="background:#1d6fd6"></div><span>${m.atb} ATB</span></div>
      <div class="pill"><div class="para" style="background:#2563eb"></div><span>${m.mp} MP</span></div>
      ${powerPill(m)}
    </div></div>`;
}
function moveCard(id, cls, x, y, r){
  const m = MV[id], e = EL[m.el];
  const nw = id===ui.mv, f = (cls.match(/\bs\d\b/)||[""])[0];
  return `<div class="mcard ${cls}" data-id="${id}" ${f?`data-f="${f}"`:""} style="left:${x}px;top:${y}px;--r:${r}deg"><div class="shd"></div><div class="body"></div>${nw?`<div class="newtag">NEW!</div>`:""}
    <div class="tile" data-tip="el:${m.el}" style="background:${e.c}"><span class="ico" style="${ICON(e.i)};color:${e.dark?"#0a1520":"#fff"}"></span></div>
    <span class="ico wm" style="${ICON(e.i)}"></span>
    <div class="mn">${m.n.toUpperCase()}</div><div class="bad">${badges(m)}</div>
    <div class="cost"><span class="atb">${[0,1,2,3,4].map(i=>`<s class="${i<m.atb?"on":""}"></s>`).join("")}</span><span>${m.mp}MP</span></div></div>`;
}
function queueHTML(){
  const lab = s => s.k==="xp" ? ["XP","Experiência do grupo"] : s.k==="lv" ? ["LV",`${s.m.name} · Lv ${s.m.from.lv} → ${s.m.lv}${s.m.hero?" · pontos":" · auto"}`]
    : s.k==="mv" ? ["MOVE",`${s.m.name} · ${MV[s.mv].n}`] : ["MAPA","Voltar à exploração"];
  return `<div class="box" id="queue"><div class="sec">NESTA VITÓRIA // ${steps.length-1} ETAPAS</div>${steps.map((s,i)=>{const [k,t]=lab(s);
    return `<div class="qi ${i<si?"done":i===si?"cur":""}" style="--r:${TILT.queue[i%6]}deg"><div class="para sh"></div><div class="para bg"></div><div class="t"><span class="k">${k}</span>${t}</div></div>`}).join("")}</div>`;
}
function stripHTML(){ return `<div class="box" id="strip">${steps.map((s,i)=>`<span class="${i<si?"d":i===si?"c":""}">${s.k==="xp"?"XP":s.k==="lv"?"LV "+s.m.name:s.k==="mv"?"MOVE "+s.m.name:"MAPA"}</span>`).join("")}</div>`; }
function prompt(txt, lock){ return `<div class="box ${lock?"lock":""}" id="prompt"><div class="para sh"></div><div class="para bg"></div><div class="t"><span class="key">Z</span>${txt}</div></div>`; }

// ---- Etapas ----
function render(){
  closeTip();
  const s = steps[si]; ui = {}; let h = `<div class="bgcity"></div>`;
  if (s.k==="xp") h += renderXP();
  else if (s.k==="lv") h += renderLV(s.m);
  else if (s.k==="mv") h += renderMV(s.m, s.mv);
  else h += `<div class="box" id="endMsg">VOLTANDO <i>/</i> MAPA</div><div class="box" id="endSub">Fim do fluxo · escolha outro cenário ou Z para repetir</div>`;
  if (s.k==="xp") h += queueHTML(); else if (s.k!=="end") h += stripHTML();
  S.innerHTML = h;
  if (s.k==="xp") animateXP();
  if (s.k==="lv") paintAttr();
  if (s.k==="mv") paintMV();
  enter();
  textFx();
}

function renderXP(){
  let h = `<div class="box" id="title"><div class="t">VICTORY <i>/</i><em>+${sc.xp} XP</em></div></div>`;
  party.forEach((m,i)=>{
    h += `<div class="card ${m.hero?"hero":"ally"} ${m.alive?"":"ko"}" style="top:${150+i*156}px;--r:${TILT.cards[i%2]}deg" id="c${i}">
      <div class="para sh"></div><div class="para bg"></div><div class="stripe"></div>
      <div class="portrait">${portrait(m.id,96,100)}</div>
      <div class="name">${m.name}</div>${elBadge(ART[m.id].el, 146 + m.name.length*17 + 14)}
      <div class="lv">LV.<b id="lv${i}">${m.from.lv}</b></div>
      ${m.alive?`<div class="gain">+${m.gain} XP</div>`:`<div class="kotag">K.O. · +0 XP</div>`}
      <div class="xpbar"><div class="para track"></div><div class="fill" id="f${i}"><div class="para" style="width:502px"></div></div>
        <div class="num" id="n${i}">${m.from.xp} / ${REQ(m.from.lv)} XP</div></div>
      <div class="stamp" id="st${i}"><div class="para"></div><div class="t">LEVEL UP!</div></div></div>`;
  });
  h += `<div class="note">XP de todos ao mesmo tempo, em velocidade normal (sem a câmera lenta). Quem caiu recebe 0 (D-402).</div>`;
  return h + prompt("CONTINUAR", true);
}
function animateXP(){
  ui.done = false; const T = 1400, t0 = performance.now() + (ANIM==="none" ? 0 : 650);
  function frame(now){
    if (!document.getElementById("f0")) return;  // saiu da etapa de XP
    const p = Math.max(0, Math.min(1,(now-t0)/T)), e = 1-Math.pow(1-p,3);
    party.forEach((m,i)=>{
      let lv = m.from.lv, xp = m.from.xp + m.gain*e;
      while (xp >= REQ(lv) && lv < m.lv) { xp -= REQ(lv); lv++; }
      document.getElementById("f"+i).style.width = (502*Math.min(1,xp/REQ(lv)))+"px";
      document.getElementById("n"+i).textContent = `${Math.floor(xp)} / ${REQ(lv)} XP`;
      if (lv > m.from.lv){ document.getElementById("lv"+i).innerHTML = `${m.from.lv}<span class="arrow">→</span>${lv}`;
        document.getElementById("st"+i).classList.add("on"); }
    });
    if (p<1) requestAnimationFrame(frame); else { ui.done = true; document.getElementById("prompt").classList.remove("lock"); }
  }
  requestAnimationFrame(frame);
}

function renderLV(m){
  ui.m = m; ui.sel = 0; ui.alloc = {}; ui.left = m.pts;
  if (!m.hero){ ui.alloc[m.prefer] = m.pts; ui.left = 0; ui.sel = 6; }
  const hpG = m.hp[1]*m.lvGain, mpG = m.mp[1]*m.lvGain;
  return `<div class="box" id="lvCard"><div class="para sh"></div><div class="para" style="background:${m.hero?"var(--paper)":"#e6e3d2"}"></div>
    <div class="big-portrait">${portrait(m.id,196,216)}</div>
    <div class="nm">${m.name}</div>
    <div class="lvl">LV. <b>${m.from.lv}</b><span class="arrow">→</span><b>${m.lv}</b></div>
    <div class="sub">${m.hero?"Líder · distribua os pontos":"Aliado · pontos automáticos"}<br>${m.pts} ponto${m.pts>1?"s":""} de atributo</div>
    <div class="statgain">
      <div class="sg" style="--r:${TILT.sg[0]}deg;--sc:${STAT_C.HP}"><div class="para"></div><div class="tag"></div><div class="t"><span class="lab">HP MÁX</span><span>${m.hp[0]}<em>+${hpG}</em></span></div></div>
      <div class="sg" style="--r:${TILT.sg[1]}deg;--sc:${STAT_C.MP}"><div class="para"></div><div class="tag"></div><div class="t"><span class="lab">MP MÁX</span><span>${m.mp[0]}<em>+${mpG}</em></span></div></div>
    </div>
    <div class="stamp on"><div class="para"></div><div class="t">LEVEL UP!</div></div></div>
    <div class="box" id="attr"><div class="para sh"></div><div class="para bg"></div><h3>ATTRIBUTES <i>/</i></h3><div class="pts" id="pts"></div>
    ${STATS.map((st,i)=>`<div class="row" id="r${i}" style="top:${84+i*52}px;--r:${TILT.rows[i]}deg;--sc:${STAT_C[st[0]]}"><div class="para"></div><div class="tag"></div><div class="t">
      <span class="st">${st[0]}</span><span class="ds" id="d${i}">${st[1]}</span>
      <span class="vl">${m.hero?`<span class="btn">◀</span>`:""}<b id="v${i}"></b><span class="plus" id="p${i}"></span>${m.hero?`<span class="btn">▶</span>`:""}</span></div></div>`).join("")}
    <div class="cbtn" id="cb"><div class="para sh"></div><div class="para bg"></div><div class="t" id="cbt"></div></div></div>`;
}
function paintAttr(){
  const m = ui.m;
  STATS.forEach(([st],i)=>{
    const a = ui.alloc[st]||0, r = document.getElementById("r"+i);
    document.getElementById("v"+i).textContent = m.stats[st] + a;
    document.getElementById("p"+i).textContent = a ? "+"+a : "";
    r.classList.toggle("sel", ui.sel===i); r.classList.toggle("auto", !m.hero && a>0);
    if (!m.hero && a>0) document.getElementById("d"+i).innerHTML = `<span class="why">Nature ${m.nature}: prioriza ${st}</span>`;
  });
  document.getElementById("pts").textContent = m.hero ? `PONTOS: ${ui.left}` : "AUTOMÁTICO";
  const cb = document.getElementById("cb"); cb.classList.toggle("ready", ui.left===0); cb.classList.toggle("sel", ui.sel===6);
  document.getElementById("cbt").textContent = ui.left===0 ? "CONFIRMAR" : "DISTRIBUA TODOS OS PONTOS";
}

function renderMV(m, mv){
  ui.m = m; ui.mv = mv; ui.full = m.moves.length >= 8; ui.learned = !ui.full; ui.newIdx = -1; ui.result = "";
  if (!ui.full){ m.moves = [...m.moves, mv]; ui.newIdx = m.moves.length-1; }
  let h = `<div class="box" id="mvHead"><div class="t">NEW <i>/</i><em>MOVE</em></div></div>
    ${sheet(mv, 'id="newMove" style="left:52px;top:132px;--r:-2.5deg"')}
    <div class="box sec" id="slotsHead">${m.name} // MOVES ${Math.min(8,m.moves.length)}/8<span id="slotsSub">${ui.full?"cheio: escolha um para esquecer":`aprendido na vaga ${m.moves.length}`}</span></div>
    <div id="slots">`;
  for (let i=0;i<8;i++) h += slotHTML(i);
  h += `</div>`;
  if (ui.full) h += `<div class="skip" id="skip" data-f="skip"><div class="para sh"></div><div class="para bg"></div><div class="t">NÃO APRENDER ${MV[mv].n.toUpperCase()}</div></div>`;
  h += `<div class="box" id="mvMsg"></div>
    <div id="confirm"><div class="box"><div class="para sh"></div><div class="para bg"></div><div class="q" id="cq"></div>
    <div class="a"><span><span class="key">Z</span>Sim</span><span><span class="key">X</span>Voltar</span></div></div></div>`;
  h += prompt(ui.full?"ESCOLHA UM MOVE":"CONTINUAR", ui.full).replace('id="prompt"','id="prompt" data-f="go"');
  ui.focus = ui.full ? "s0" : "sheet";
  return h + `<div class="note" style="left:540px;max-width:300px">PROPOSTA (não aprovada): com vaga livre aprende sozinho; com 8 cheias escolhe esquecer um ou recusar.</div>`;
}
function slotHTML(i){
  const m = ui.m, id = m.moves[i], x = 540 + (i%2)*350, y = 166 + Math.floor(i/2)*110, r = TILT.slots[i];
  if (!id) return `<div class="mcard empty" style="left:${x}px;top:${y}px;--r:${r}deg"><div class="body"></div><div class="mn">VAGA LIVRE</div></div>`;
  return moveCard(id, `s${i} ${i===ui.newIdx?"arrive":""}`, x, y, r);
}
// Pinta só textos e foco; a grade NÃO é refeita (refazer reiniciava as animações).
function paintMV(){
  const m = ui.m;
  S.querySelectorAll("[data-f]").forEach(el=>el.classList.toggle("foc", el.dataset.f===ui.focus));
  const sk = document.getElementById("skip"); if (sk) sk.classList.toggle("hide", ui.learned);
  if (ui.result) document.getElementById("slotsSub").textContent = ui.newIdx>=0 ? `aprendido na vaga ${ui.newIdx+1}` : "nada mudou";
  const msg = document.getElementById("mvMsg"), txt = ui.result || (ui.full ? "Setas escolhem o Move. Z inspeciona; na inspeção, Z esquece." : `${m.name} aprendeu <b>${MV[ui.mv].n}</b>!`);
  if (msg.dataset.txt !== txt){ msg.dataset.txt = txt; msg.innerHTML = txt; }
  const go = document.getElementById("prompt");
  go.classList.toggle("lock", !ui.learned);
  go.querySelector(".t").innerHTML = `<span class="key">Z</span>${ui.learned?"CONTINUAR":"ESCOLHA UM MOVE"}`;
}
// Navegação espacial: vai para o item mais próximo na direção da seta.
function moveFocus(dir){
  const items = [...S.querySelectorAll("[data-f]")].filter(el=>!el.classList.contains("hide"));
  const cur = items.find(el=>el.dataset.f===ui.focus) || items[0];
  const c = r => ({x:r.left+r.width/2, y:r.top+r.height/2}), a = c(cur.getBoundingClientRect());
  const v = {ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[dir];
  let best = null, bd = 1e9;
  for (const el of items){ if (el===cur) continue; const b = c(el.getBoundingClientRect()), dx = b.x-a.x, dy = b.y-a.y;
    const along = dx*v[0]+dy*v[1]; if (along <= 4) continue; const across = Math.abs(dx*v[1]-dy*v[0]);
    const d = along + across*2.2; if (d < bd){ bd = d; best = el; } }
  if (best) ui.focus = best.dataset.f;
}
function activate(f){
  if (f==="sheet") return openInspect(ui.mv, false);
  if (f==="skip") return confirmSkip();
  if (f==="go"){ if (ui.learned) next(); return; }
  const i = +f.slice(1), id = ui.m.moves[i];
  if (id) openInspect(id, false, ui.full && !ui.learned ? i : -1);
}
function confirmSkip(){
  document.getElementById("cq").innerHTML = `Não aprender <b>${MV[ui.mv].n}</b>?<br>Ele não será aprendido agora.`;
  document.getElementById("confirm").classList.add("on");
}
function forgetSlot(i){
  const old = ui.m.moves[i]; ui.m.moves[i] = ui.mv; ui.newIdx = i; ui.full = false; ui.learned = true;
  ui.result = `${ui.m.name} esqueceu ${MV[old].n} e aprendeu <b>${MV[ui.mv].n}</b>!`;
  const tmp = document.createElement("div"); tmp.innerHTML = slotHTML(i);
  S.querySelector(`#slots [data-f="s${i}"]`).replaceWith(tmp.firstElementChild);
  epicArrive(S.querySelector(`#slots [data-f="s${i}"]`), 80);
  ui.focus = "go"; paintMV();
}

// ---- Entrada dos blocos (rodada 2) ----
const ENTER_SEL = "#title,.card,#queue .sec,.qi,#strip span,#lvCard,#attr,.row,.cbtn,#mvHead,.sheet,#slotsHead,#slots .mcard,.skip,#mvMsg,#prompt,#endMsg,#endSub";
function enter(){
  let last = 0;
  if (ANIM!=="none") S.querySelectorAll(ENTER_SEL).forEach((el,i)=>{
    if (el.classList.contains("arrive")) return;          // o Move novo entra depois, com animação própria
    el.classList.add("enter", ANIM); el.style.animationDelay = (i*45)+"ms"; last = i*45;
    el.addEventListener("animationend", ev=>{ if (ev.target!==el) return; el.classList.remove("enter", ANIM); el.style.animationDelay=""; });
  });
  S.querySelectorAll(".mcard.arrive").forEach(el=>epicArrive(el, last + 450));
}
// Rodada 10: o Move novo cai do alto, bate na vaga e explode em anel, raios, faíscas e o glifo do elemento.
// No Godot: Tween de posição/escala/rotação + CPUParticles2D/Line2D/TextureRect com modulate (nada de flash de tela).
function epicArrive(el, delay){
  const id = el.dataset.id, e = EL[MV[id].el], col = e.c;
  setTimeout(()=>{
    if (!el.isConnected) return;
    let spot = document.getElementById("spot");
    if (!spot){ spot = document.createElement("div"); spot.id = "spot"; S.appendChild(spot); }
    spot.classList.add("on");
    el.classList.remove("arrive"); el.classList.add("arriving");
    setTimeout(()=>{                                   // impacto (55% de .62s)
      if (!el.isConnected) return;
      const sr = S.getBoundingClientRect(), k = sr.width/1280, r = el.getBoundingClientRect();
      const cx = (r.left + r.width/2 - sr.left)/k, cy = (r.top + r.height/2 - sr.top)/k;
      const add = (cls, style) => { const d = document.createElement("div"); d.className = "fx " + cls;
        d.style.cssText = `left:${cx}px;top:${cy}px;--c:${col};` + style; S.appendChild(d); setTimeout(()=>d.remove(), 1000); };
      add("ghost", ICON(e.i));
      add("ring", ""); add("ring r2", "");
      for (let i=0;i<14;i++){ const a = i*(360/14) + (i%2?8:-8); add("ray", `width:${140+(i%3)*50}px;--a:${a}deg`); }
      for (let i=0;i<18;i++){ const a = Math.random()*Math.PI*2, d = 120 + Math.random()*170;
        add("spark", `--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d + 60}px;background:${i%3? col : "#fff"}`); }
      // Treme cada card (não o contêiner: tremer o contêiner o jogaria para baixo do holofote).
      S.querySelectorAll("#slots .mcard, .sheet").forEach(c=>{ c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); });
      el.classList.add("slammed");
    }, 340);
    setTimeout(()=>{ spot.classList.remove("on"); }, 1050);
    el.addEventListener("animationend", ev=>{ if (ev.target===el) el.classList.remove("arriving"); });
  }, delay);
}



// ---- Rodada 11: valores mecânicos do jogo, coloridos ----
const STAT_FULL = {Strength:"STR", Magic:"MAG", Vitality:"VIT", Wisdom:"WIS", Agility:"AGI", Luck:"LUK"};
function hl(t){
  return t.replace(/(\b(?:STR|MAG|VIT|WIS|AGI|LUK)\b)|(\b(?:Strength|Wisdom|Magic|Vitality|Agility|Luck)\b)|(\d+(?:[.,]\d+)?\s?s\b)|([+-]?\d+(?:[.,]\d+)?%|×\s?\d+(?:[.,]\d+)?|x\d+(?:[.,]\d+)?)|(\b(?:STUN|BURN|ARMOR|Guard|GUARD|Burst|K\.O\.)\b)|(\bHP\b)|(\bMP\b)|(\bATB\b)/g,
    (m, st, stf, sec, num, sta, hp, mp, atb) =>
      st ? `<b style="color:${STAT_C[st]}">${m}</b>` : stf ? `<b style="color:${STAT_C[STAT_FULL[stf]]}">${m}</b>` :
      sec ? `<b class="hl-s">${m}</b>` : num ? `<b class="hl-n">${m}</b>` : sta ? `<b class="hl-st">${m}</b>` :
      hp ? `<b style="color:${STAT_C.HP}">${m}</b>` : mp ? `<b style="color:${STAT_C.MP}">${m}</b>` : `<b class="hl-s">${m}</b>`);
}
const ELC = {NEUTRAL:"#cbd5e1",FIRE:"#f97316",WATER:"#0284c7",ELECTRIC:"#fde047",PSYCHIC:"#ec4899",NATURE:"#84cc16",SOUND:"#06b6d4",EARTH:"#b45309",WIND:"#4ff7ba",LIGHT:"#fef08a",DARK:"#a855f7",MYSTIC:"#65b5b3"};
function valsHTML(T){
  const fmt = n => String(n.toFixed(2)).replace(/0$/,"").replace(".",",");
  const status = T.kind===3, dmg = !status;
  const type = status ? ["STATUS","#94a3b8"] : T.dtype===1 ? ["MAGICAL","#38bdf8"] : ["PHYSICAL","#ef4444"];
  const target = T.friendly ? (T.aoe ? "ALL ALLIES" : "ONE ALLY") : (T.aoe ? "ALL ENEMIES" : "ONE ENEMY");
  const range = status ? "—" : T.aoe ? "AREA" : T.kind===0 ? "MELEE" : T.kind===1 ? "LONG" : "MID";
  const scale = dmg ? (T.dtype===1 ? "MAG" : "STR") : "";
  const v = (l, x, c, w) => `<div class="v ${w?"wide":""}"><small>${l}</small><b style="color:${c||"#fff"}">${x}</b></div>`;
  // D-420: tipo, elemento, alcance, custo e poder já aparecem no cabeçalho (cor, badges, chips): não repetir.
  let h = v("TARGET", target, "#e2e8f0", true) + v("WIND-UP", fmt(T.windup)+" s", "var(--aqua)");
  if (status) h += v("ENGINE PAUSE", T.pause ? fmt(T.pause)+" s" : "NONE", T.pause ? "var(--aqua)" : "#94a3b8");
  if (scale) h += v("SCALES", scale, STAT_C[scale]);
  const extra = [];
  if (T.tags.includes("stun")) extra.push(["ON HIT","STUN","var(--coral)"]);
  if (T.tags.includes("guard_break")) extra.push(["BREAKS","GUARD","var(--coral)"]);
  if (T.tags.includes("untargetable")) extra.push(["DURING","UNTARGETABLE","var(--lime)"]);
  if (T.bypass) extra.push(["IGNORES","DEFENSE","var(--coral)"]);
  extra.forEach(e=>h += v(e[0], e[1], e[2]));
  return h;
}

// D-1187: previsão com os atributos reais de quem aprende (só dados do jogo).
function forecast(id, T){
  const m = ui.m, st = m ? m.stats : {MAG:0,STR:0}, out = [];
  if (T.kind !== 3){
    const sc = T.dtype===1 ? "MAG" : "STR";
    out.push(`Damage = ${Math.round(T.power*100)}% of ${sc} (${sc} ${st[sc]})${T.aoe?", on every enemy":", on one target"}.`);
  } else if (/10 \+ MAG/.test(T.effect)) {
    out.push(`Heals 10 + MAG = ${10 + st.MAG} HP on each living ally.`);
  } else {
    out.push(T.effect.split("|").map(x=>x.trim()).filter(x=>!/ATB$/.test(x)).join(". ") + ".");
  }
  if (/not implemented/i.test(T.effect)) out.push("This effect does not work in battle yet.");
  if (T.kind===3 && T.pause) out.push(`The battle engine pauses for ${String(T.pause).replace(".",",")} s while it resolves.`);
  return out.join(" ");
}

// ---- Rodada 13: mecânicas de cada Move, tiradas do código do combate (não dos textos) ----
// Fontes: scripts/combat/battle.gd (WINDUP, PERFECT_WINDOW 0,25, EVADE_LATE_GRACE, AUTO_DODGE_CHANCE 0,10,
// CRIT_CHANCE 0,10, _interrupt_attacks_of), damage_math.gd (CRIT_MULT 2, GUARD_REDUCTION 0,5, WIS),
// affinity WEAK 1,5 / RESIST 0,5, move_behaviors.gd e content/moves/media/behavior.gd.
const MECH = {
  confusion: [], psybeam: [],
  shockwave: ["If it is dodged, the impact still shows but deals no damage."],
  teleport: ["The user can't be hit during the strike: attacks on it miss."],
  media: ["Heals 10 + MAG HP on every living ally (up to max HP)."],
  sukunda: ["-1 SPD on one enemy, down to -5. Lasts the whole battle."],
  tarukaja: ["+1 ATK on every living ally, up to +5. Lasts the whole battle.", "ATK buffs raise physical damage only."],
  megido: ["Hits every enemy."], hassou: ["Hits every enemy."],
  heal: ["Its effect is not implemented in battle yet: it does nothing."],
  ebeam: ["On hit: 20% + (user LUK − target LUK)% chance to STUN the target for 4 s."],
  machpunch: ["Wind-up of only 0.2 s: good for hitting an enemy in its wind-up."],
  karate: ["On hit: 30% chance of -1 SPD on the target (down to -5)."],
  brick: ["Breaks the target's Guard."],
  taunt: ["The target's next attack goes to the user.", "Attacks it already aimed at someone else are redirected to the user."],
  warcry: ["Interrupts every enemy in wind-up; their ATB is not refunded.", "+1 Burst if it interrupts at least one (once per use). No damage."]
};
const PLANNED = { confusion: ["Planned (D-1187): 20% + LUK chance to cause Confusion. Not active yet."] };
function mechHTML(id, T){
  const own = (MECH[id]||[]).map(x=>`<li>${hl(x)}</li>`).concat((PLANNED[id]||[]).map(x=>`<li class="plan">${x}</li>`));
  const rules = [];
  if (T.kind !== 3){
    rules.push("If the user is hit during the wind-up, the Move is cancelled and its ATB is lost." + (T.kind===1 ? " Once fired, hitting the user no longer stops it." : ""));
    rules.push("Dodge: manual Evade in the last 0.25 s before contact; 10% auto-dodge.");
    rules.push("10% crit for ×2 damage. Weak target ×1.5, Resist ×0.5. Guard halves it.");
    if (T.dtype===1) rules.push("The target's WIS reduces it: ×10/(10+WIS).");
  } else {
    rules.push("Can't be dodged.");
    rules.push(T.pause ? `The battle pauses for ${String(T.pause).replace(".",",")} s while it resolves.` : "It does not pause the battle.");
  }
  return (own.length ? `<div class="s"><h4>EFFECT<i>/</i></h4><ul>${own.join("")}</ul></div>` : "")
       + `<div class="s"><h4>COMBAT RULES<i>/</i></h4><ul>${rules.map(x=>`<li>${hl(x)}</li>`).join("")}</ul></div>`;
}

// ---- Rodada 13: pop-up que explica o ícone (some em 5 s ou no X) ----
const TIPS = {
  MAG: ["MAGICAL", "Uses the user's MAG. The target's WIS reduces it."],
  PHY: ["PHYSICAL", "Uses the user's STR. ATK buffs (Tarukaja) raise it."],
  status: ["STATUS", "Status Move: no damage, can't be dodged. It pauses the battle while it resolves."],
  FIELD: ["FIELD", "Field Move."],
  "rg:melee": ["MELEE", "The user runs to the target and strikes it up close."],
  "rg:mid": ["MID RANGE", "Cast on the target from where the user stands."],
  "rg:long": ["LONG RANGE", "A projectile or beam fired from where the user stands."],
  "rg:area": ["AREA", "Hits every enemy at once."]
};
function tipText(key){
  if (key.startsWith("el:")){ const el = key.slice(3);
    return [el, `${el[0]+el.slice(1).toLowerCase()} element. A target weak to it takes ×1.5; a resistant one takes ×0.5.`]; }
  return TIPS[key] || [key, ""];
}
let tipTimer = 0;
function closeTip(){ const t = document.getElementById("tip"); if (t) t.remove(); clearTimeout(tipTimer); }
function showTip(icon){
  closeTip();
  const [title, body] = tipText(icon.dataset.tip);
  const sr = S.getBoundingClientRect(), k = sr.width/1280, r = icon.getBoundingClientRect();
  const t = document.createElement("div"); t.id = "tip";
  t.innerHTML = `<b>${title}</b>${hl(body)}<span class="x">✕</span><span class="bar"></span>`;
  S.appendChild(t);
  let x = (r.left - sr.left)/k - 20, y = (r.bottom - sr.top)/k + 12;
  if (x + 300 > 1260) x = 1260 - 300;
  if (y + t.offsetHeight > 700) y = (r.top - sr.top)/k - t.offsetHeight - 12;
  t.style.left = x + "px"; t.style.top = y + "px";
  tipTimer = setTimeout(closeTip, 5000);
}
// Captura antes do clique do card: clicar no ícone mostra o pop-up e não abre a inspeção.
S.addEventListener("click", ev=>{
  if (ev.target.closest("#tip .x")){ closeTip(); ev.stopPropagation(); return; }
  const icon = ev.target.closest("[data-tip]");
  if (icon){ showTip(icon); ev.stopPropagation(); }
}, true);

// ---- Inspeção do Move (rodada 6) ----
function openInspect(id, arrival, forgetIdx=-1){
  const m = MV[id], e = EL[m.el], T = INSPECT[id], fg = e.dark ? "#080e18" : "#fff";
  const sec = (t, x) => `<div class="s"><h4>${t}<i>/</i></h4><p>${x}</p></div>`;
  const el = document.createElement("div"); el.id = "insp";
  const nw = id===ui.mv;
  el.innerHTML = `<div class="box head"><div class="para sh"></div><div class="para" style="background:${e.c}"></div>${nw?`<div class="newtag" style="font-size:28px;right:-16px;top:-22px">NEW!</div>`:""}
      <span class="ico wm" style="${ICON(e.i)};color:${e.dark?"#000":"#fff"};opacity:${e.dark?.16:.24}"></span>
      <div class="kick" style="color:${fg};opacity:.75">${ui.m ? ui.m.name+" // " : ""}INSPECT</div>
      <div class="mn" style="color:${fg}">${m.n.toUpperCase()}</div>
      <div class="badges">${badges(m)}</div>
      <div class="lines">${m.lines.map(x=>`<div>${hl(x)}</div>`).join("")}</div>
      <div class="costs">
        <div class="pill"><div class="para" style="background:#1d6fd6"></div><span>${m.atb} ATB</span></div>
        <div class="pill"><div class="para" style="background:#2563eb"></div><span>${m.mp} MP</span></div>
        ${powerPill(m)}
      </div></div>
    <div class="box blk b1"><div class="para sh"></div><div class="para bg"></div><div class="side">MECHANICS</div><div class="in">
      <div class="vals">${valsHTML(T)}</div>
      ${mechHTML(id, T)}
      ${sec("WITH " + (ui.m ? ui.m.name : "THIS CASTER"), hl(forecast(id, T)))}</div></div>
    <div class="box blk b2"><div class="para sh"></div><div class="para bg"></div><div class="side">VISUALS</div><div class="in">
      ${sec("LOOK", T.visual)}${sec("MOTION & DISPLACEMENT", T.motion)}${T.posture?sec("WIND-UP POSTURE", T.posture):""}</div></div>
    ${forgetIdx>=0
      ? `<div class="box close alt" data-act="forget"><div class="para sh"></div><div class="para bg"></div><div class="t"><span class="key">Z</span>ESQUECER ESTE</div></div>
         <div class="box close" data-act="back"><div class="para sh"></div><div class="para bg"></div><div class="t"><span class="key">X</span>VOLTAR</div></div>`
      : `<div class="box close" data-act="back"><div class="para sh"></div><div class="para bg"></div><div class="t"><span class="key">Z</span>FECHAR</div></div>`}`;
  S.appendChild(el);
  // Encolhe a fonte do bloco até caber (sem cortar texto, sem rolagem).
  el.querySelectorAll(".in").forEach(b=>{ let fs = 16; while (b.scrollHeight > b.clientHeight + 1 && fs > 11){ fs -= 0.5;
    b.querySelectorAll("p, li").forEach(p=>{ p.style.fontSize = fs+"px"; p.style.lineHeight = (fs+5)+"px"; }); } });
  ui.insp = true; ui.forgetIdx = forgetIdx;
  if (ANIM!=="none") el.querySelectorAll(".box").forEach((b,i)=>{ b.classList.add("enter", ANIM); b.style.animationDelay = (i*60)+"ms";
    b.addEventListener("animationend", ()=>{ b.classList.remove("enter", ANIM); b.style.animationDelay=""; }, {once:true}); });
  if (TXT) textFxIn(el);
}
function closeInspect(){ const el = document.getElementById("insp"); if (el) el.remove(); ui.insp = false; }

// ---- Animação de texto na entrada (rodada 5) ----
let TXT = true;
const LETTERS = "#title .t,#mvHead .t,#attr h3,.card .name,#lvCard .nm,.sheet .mn,#lvCard .stamp .t,#endMsg";
const TYPE_SEL = ".sheet .desc,#mvMsg,#lvCard .sub,#endSub";
function blockDelay(el){ const b = el.closest(".enter"); return b ? parseFloat(b.style.animationDelay)||0 : 0; }
function textNodes(el){ const out = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) out.push(n); return out; }
function textFx(){ if (TXT) textFxIn(S); }
function textFxIn(root){
  root.querySelectorAll(LETTERS + ",#insp .head .mn").forEach(el=>{
    let d = blockDelay(el) + 140;
    for (const n of textNodes(el)){
      const frag = document.createDocumentFragment();
      for (const ch of n.textContent){
        if (ch.trim()===""){ frag.appendChild(document.createTextNode(ch)); continue; }
        const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = ch; sp.style.animationDelay = d+"ms"; d += 28;
        frag.appendChild(sp);
      }
      n.replaceWith(frag);
    }
  });
  root.querySelectorAll(TYPE_SEL + ",#insp .s p").forEach(el=>{
    const nodes = textNodes(el), full = nodes.map(n=>n.textContent); nodes.forEach(n=>n.textContent="");
    // Avança pelo tempo decorrido (16 ms por caractere), não por tick: não atrasa se o navegador segurar os timers.
    const total = full.join("").length, t0 = performance.now() + blockDelay(el) + 260, cps = el.closest("#insp") ? 4 : 16;
    const tick = ()=>{ if (!el.isConnected) return;
      let n = Math.max(0, Math.min(total, Math.floor((performance.now() - t0) / cps)));
      for (let j = 0; j < nodes.length; j++){ const take = Math.min(n, full[j].length); nodes[j].textContent = full[j].slice(0, take); n -= take; }
      if (performance.now() - t0 < total * cps) setTimeout(tick, 16); };
    setTimeout(tick, 16);
  });
}

// ---- Teclado ----
addEventListener("keydown", ev=>{
  const k = ev.key, s = steps[si];
  const Z = k==="z"||k==="Z"||k==="Enter", X = k==="x"||k==="X"||k==="Escape";
  if (s.k==="xp"){ if (Z && ui.done) next(); return; }
  if (s.k==="lv"){
    const m = ui.m;
    if (k==="ArrowUp") ui.sel = (ui.sel+6)%7; else if (k==="ArrowDown") ui.sel = (ui.sel+1)%7;
    else if (m.hero && k==="ArrowRight" && ui.sel<6 && ui.left>0){ const st=STATS[ui.sel][0]; ui.alloc[st]=(ui.alloc[st]||0)+1; ui.left--; }
    else if (m.hero && k==="ArrowLeft" && ui.sel<6){ const st=STATS[ui.sel][0]; if (ui.alloc[st]){ ui.alloc[st]--; ui.left++; } }
    else if (Z){ if (ui.sel<6 && ui.left>0 && m.hero){ const st=STATS[ui.sel][0]; ui.alloc[st]=(ui.alloc[st]||0)+1; ui.left--; }
      else if (ui.left===0 && (ui.sel===6 || !m.hero)){ for (const st in ui.alloc) m.stats[st]+=ui.alloc[st]; next(); return; }
      else if (ui.left===0) ui.sel = 6; }
    paintAttr(); return;
  }
  if (s.k==="mv"){
    if (ui.insp){
      if (Z && ui.forgetIdx>=0){ const i = ui.forgetIdx; closeInspect(); forgetSlot(i); }
      else if (Z||X||k==="c"||k==="C") closeInspect();
      return;
    }
    const c = document.getElementById("confirm");
    if (c.classList.contains("on")){
      if (Z){ c.classList.remove("on"); ui.newIdx = -1; ui.full = false; ui.learned = true;
        ui.result = `${ui.m.name} não aprendeu <b>${MV[ui.mv].n}</b>.`; ui.focus = "go"; paintMV(); }
      else if (X) c.classList.remove("on");
      return;
    }
    if (k.startsWith("Arrow")){ moveFocus(k); paintMV(); ev.preventDefault(); return; }
    if (Z || k==="c" || k==="C"){ activate(ui.focus); if (steps[si].k==="mv") paintMV(); }
    return;
  }
  if (s.k==="end" && Z) start(document.querySelector("#bar button[data-s].on").dataset.s);
});
// Rodada 7: clique em qualquer Move abre a inspeção dele.
S.addEventListener("click", ev=>{
  if (ui.insp){ const b = ev.target.closest("#insp .close"); if (!b) return;
    if (b.dataset.act==="forget"){ const i = ui.forgetIdx; closeInspect(); forgetSlot(i); } else closeInspect(); return; }
  if (document.querySelector("#confirm.on") || steps[si].k!=="mv") return;
  const el = ev.target.closest("[data-f]");
  if (el){ ui.focus = el.dataset.f; activate(el.dataset.f); if (steps[si].k==="mv") paintMV(); }
});
// Passar o mouse por cima seleciona (com a mesma animação).
S.addEventListener("mouseover", ev=>{
  if (ui.insp || steps[si].k!=="mv" || document.querySelector("#confirm.on")) return;
  const el = ev.target.closest("[data-f]"); if (el && el.dataset.f!==ui.focus){ ui.focus = el.dataset.f; paintMV(); }
});
function next(){ si = Math.min(steps.length-1, si+1); render(); }

document.querySelectorAll("#bar button[data-s]").forEach(b=>b.onclick=()=>{ start(b.dataset.s); b.blur(); });
document.querySelectorAll("#bar button[data-a]").forEach(b=>b.onclick=()=>{ ANIM=b.dataset.a;
  document.querySelectorAll("#bar button[data-a]").forEach(x=>x.classList.toggle("on", x===b));
  start(document.querySelector("#bar button[data-s].on").dataset.s); b.blur(); });
document.querySelector('#bar button[data-a="slide"]').classList.add("on");
document.querySelectorAll("#bar button[data-x]").forEach(b=>b.onclick=()=>{ TXT = b.dataset.x==="on";
  document.querySelectorAll("#bar button[data-x]").forEach(x=>x.classList.toggle("on", x===b));
  start(document.querySelector("#bar button[data-s].on").dataset.s); b.blur(); });
document.querySelector('#bar button[data-x="on"]').classList.add("on");
fit(); start("C");
</script>
